openapi: 3.0.1
info:
  title: will be replaced
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
paths:
  /agencyadmin:
    get:
      tags:
        - root-controller
      summary: 'Returns the hal root entry point. [Authorization: Role: agency-admin]'
      operationId: getRoot
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RootDTO'
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
      security:
        - Bearer: []
  /agencyadmin/agencies:
    get:
      tags:
        - admin-agency-controller
      summary: 'Returns the list of agencies by search query parameter. [Authorization: Role: agency-admin]'
      operationId: searchAgencies
      parameters:
        - name: q
          in: query
          description: The query parameter to search for
          schema:
            type: string
            example: Freiburg
        - name: page
          in: query
          description: Number of page where to start in the query (1 = first page)
          required: true
          schema:
            type: integer
            example: 1
        - name: perPage
          in: query
          description: Number of items which are being returned per page
          required: true
          schema:
            type: integer
            example: 20
        - name: sort
          in: query
          description: The sort parameter containing field and order the response should be sorted
          schema:
            $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AgencyAdminSearchResultDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    post:
      tags:
        - admin-agency-controller
      summary: 'Creates a new agency [Authorization: Role: agency-admin]'
      operationId: createAgency
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyDTO'
        required: true
      responses:
        '201':
          description: CREATED - agency was created successfully
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AgencyAdminFullResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/agencies/{agencyId}:
    get:
      tags:
        - admin-agency-controller
      summary: 'Get an agency including platform agency admin controls in settings.agencyAdminControls [Authorization: Role: agency-admin]'
      operationId: getAgency
      parameters:
        - name: agencyId
          in: path
          description: Agency ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - agency found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyAdminFullResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - agency with the provided ID does not exist
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    delete:
      tags:
        - admin-agency-controller
      summary: 'Flags an agency as deleted [Authorization: Role: agency-admin]'
      operationId: deleteAgency
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - agency was deleted successfully
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - agency not found
        '409':
          description: CONFLICT - agency contains consultants and therefore can't be deleted
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    put:
      tags:
        - admin-agency-controller
      summary: 'Updates an agency including settings.agencyAdminControls [Authorization: Role: agency-admin]'
      operationId: updateAgency
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgencyDTO'
        required: true
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - agency was updated successfully
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AgencyAdminFullResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - agency not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/agencies/tenant/{tenantId}:
    get:
      tags:
        - admin-agency-controller
      summary: 'Get an agency [Authorization: Roles: agency-admin and tenant-admin]'
      operationId: getAgenciesByTenantId
      parameters:
        - name: tenantId
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyAdminFullResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - agency with the provided tenant id does not exist
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/agencies/{agencyId}/changetype:
    post:
      tags:
        - admin-agency-controller
      summary: 'Change an agency from team-agency to default and vice-versa and switch the associated consultant accounts to team consultant or default consultant. Ongoing team counselings change to 1:1 when converting agency to default status. 1:1 counselings remain single counselings when swapping the agency to team-agency. [Authorization: Role: user-admin]'
      operationId: changeAgencyType
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyTypeRequestDTO'
      responses:
        '200':
          description: OK - agency type successfully changed
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/agencies/{agencyId}/topics/{topicId}/dpp:
    get:
      tags:
        - admin-agency-controller
      summary: 'Read a department''s (Fachbereich = agency x topic) own data privacy policy (DSE) to prefill the editor. [Authorization: Role: agency-admin or restricted-agency-admin scoped to its own agencies]'
      operationId: getDepartmentDataProtection
      parameters:
        - name: agencyId
          in: path
          description: Agency Id (Beratungszentrum)
          required: true
          schema:
            type: integer
            format: int64
        - name: topicId
          in: path
          description: Topic Id (Fachbereich)
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - department data privacy policy content and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDataProtectionContentDTO'
        '400':
          description: BAD REQUEST - caller may not access this agency
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - department (agency x topic) not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    put:
      tags:
        - admin-agency-controller
      summary: 'Publish or draft-save a department''s (Fachbereich = agency x topic) own data privacy policy (DSE). [Authorization: Role: agency-admin or restricted-agency-admin scoped to its own agencies]'
      operationId: publishDepartmentDataProtection
      parameters:
        - name: agencyId
          in: path
          description: Agency Id (Beratungszentrum)
          required: true
          schema:
            type: integer
            format: int64
        - name: topicId
          in: path
          description: Topic Id (Fachbereich)
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentDataProtectionDTO'
        required: true
      responses:
        '200':
          description: OK - department data privacy policy stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDataProtectionResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request, or caller may not edit this agency
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - department (agency x topic) not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/legaltexts:
    get:
      tags:
        - admin-agency-controller
      summary: 'List the caller tenant''s shared legal texts of one kind, each with its department usage count ("used by N departments", ADR-014). Library CRUD is full-admin only: a shared text applies tenant-wide. [Authorization: Role: agency-admin]'
      operationId: getLegalTexts
      parameters:
        - name: kind
          in: query
          description: Which library to list (data privacy policies or imprints)
          required: true
          schema:
            type: string
            enum:
              - DPP
              - IMPRINT
      responses:
        '200':
          description: OK - the tenant's legal texts of that kind
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalTextAdminDTO'
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    post:
      tags:
        - admin-agency-controller
      summary: 'Create a shared legal text owned by the caller''s tenant (ADR-014). [Authorization: Role: agency-admin — full admins only, see GET]'
      operationId: createLegalText
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegalTextDTO'
        required: true
      responses:
        '200':
          description: OK - legal text stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalTextAdminDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request (e.g. blank label)
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/legaltexts/{legalTextId}:
    put:
      tags:
        - admin-agency-controller
      summary: 'Update a shared legal text (label, multilingual content, optionally publication status — omitted publish keeps the current status). Changes apply to every department referencing the text. [Authorization: Role: agency-admin — full admins only, scoped to the owning tenant]'
      operationId: updateLegalText
      parameters:
        - name: legalTextId
          in: path
          description: Legal text id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLegalTextDTO'
        required: true
      responses:
        '200':
          description: OK - legal text updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalTextAdminDTO'
        '400':
          description: BAD REQUEST - invalid request, or caller may not edit this tenant's text
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - legal text not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/agencies/{agencyId}/topics/{topicId}/legaltext-assignment:
    put:
      tags:
        - admin-agency-controller
      summary: 'Assign a shared legal text to a department''s DPP or imprint slot, or clear the slot (null = department falls back to its own inline content, content_dpp/content_imprint; tenant-level fallback is future work, ADR-014 / #136). The text''s kind must match the slot and the text must belong to the agency''s tenant. [Authorization: Role: agency-admin or restricted-agency-admin scoped to its own agencies]'
      operationId: assignDepartmentLegalText
      parameters:
        - name: agencyId
          in: path
          description: Agency Id (Beratungszentrum)
          required: true
          schema:
            type: integer
            format: int64
        - name: topicId
          in: path
          description: Topic Id (Fachbereich)
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalTextAssignmentDTO'
        required: true
      responses:
        '204':
          description: NO CONTENT - assignment stored
        '400':
          description: BAD REQUEST - kind mismatch, cross-tenant text, or caller may not edit this agency
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - department or legal text not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/agencies/{agencyId}/topics/{topicId}/imprint:
    get:
      tags:
        - admin-agency-controller
      summary: 'Read a department''s (Fachbereich = agency x topic) own imprint (Impressum) to prefill the editor. [Authorization: Role: agency-admin or restricted-agency-admin scoped to its own agencies]'
      operationId: getDepartmentImprint
      parameters:
        - name: agencyId
          in: path
          description: Agency Id (Beratungszentrum)
          required: true
          schema:
            type: integer
            format: int64
        - name: topicId
          in: path
          description: Topic Id (Fachbereich)
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - department imprint content and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentImprintContentDTO'
        '400':
          description: BAD REQUEST - caller may not access this agency
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - department (agency x topic) not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    put:
      tags:
        - admin-agency-controller
      summary: 'Publish or draft-save a department''s (Fachbereich = agency x topic) own imprint (Impressum). [Authorization: Role: agency-admin or restricted-agency-admin scoped to its own agencies]'
      operationId: publishDepartmentImprint
      parameters:
        - name: agencyId
          in: path
          description: Agency Id (Beratungszentrum)
          required: true
          schema:
            type: integer
            format: int64
        - name: topicId
          in: path
          description: Topic Id (Fachbereich)
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentImprintDTO'
        required: true
      responses:
        '200':
          description: OK - department imprint stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentImprintResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request, or caller may not edit this agency
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - department (agency x topic) not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/controls:
    get:
      tags:
        - admin-agency-controller
      summary: 'Gets platform-level agency admin controls [Authorization: Super admin]'
      operationId: getAgencyAdminControls
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyAdminControls'
        '401':
          description: UNAUTHORIZED - no/invalid Keycloak token
        '403':
          description: FORBIDDEN - only super admin can access platform controls
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    put:
      tags:
        - admin-agency-controller
      summary: 'Updates platform-level agency admin controls [Authorization: Super admin]'
      operationId: updateAgencyAdminControls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyAdminControls'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyAdminControls'
        '401':
          description: UNAUTHORIZED - no/invalid Keycloak token
        '403':
          description: FORBIDDEN - only super admin can update platform controls
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /agencyadmin/postcoderanges/{agencyId}:
    get:
      tags:
        - admin-agency-controller
      summary: 'Get the postcode ranges for an agency [Authorization: Role: agency-admin]'
      operationId: getAgencyPostcodeRanges
      parameters:
        - name: agencyId
          in: path
          description: Agency id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - agency postcode range found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyPostcodeRangeResponseDTO'
        '204':
          description: NO CONTENT - agency postcode range with the provided agency ID does not exist
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    post:
      tags:
        - admin-agency-controller
      summary: 'Creates a new postcode range for an agency [Authorization: Role: agency-admin]'
      operationId: createAgencyPostcodeRange
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostcodeRangeDTO'
        required: true
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: CREATED - agency postcode range was created successfully
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AgencyPostcodeRangeResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - provided agency ID does not exist
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    put:
      tags:
        - admin-agency-controller
      summary: 'Updates an existing postcode range for an agency [Authorization: Role: agency-admin]'
      operationId: updateAgencyPostcodeRange
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostcodeRangeDTO'
        required: true
      parameters:
        - name: agencyId
          in: path
          description: Agency id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - agency postcode range was successfully updated
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AgencyPostcodeRangeResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - agency postcode range with the provided ID does not exist
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    delete:
      tags:
        - admin-agency-controller
      summary: 'Delete a specific postcode range [Authorization: Role: agency-admin]'
      operationId: deleteAgencyPostcodeRange
      parameters:
        - name: agencyId
          in: path
          description: Agency id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - agency postcode range was deleted sucessfully
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - agency postcode range with the provided ID does not exist
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
components:
  schemas:
    RootDTO:
      type: object
      required:
        - _links
      properties:
        _links:
          $ref: '#/components/schemas/RootLinks'
    RootLinks:
      type: object
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
        agencies:
          $ref: '#/components/schemas/HalLink'
        agency:
          $ref: '#/components/schemas/HalLink'
        agencypostcodes:
          $ref: '#/components/schemas/HalLink'
    HalLink:
      type: object
      required:
        - href
      properties:
        href:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - DELETE
            - PUT
        templated:
          type: boolean
    AgencyAdminSearchResultDTO:
      type: object
      properties:
        _embedded:
          type: array
          items:
            $ref: '#/components/schemas/AgencyAdminFullResponseDTO'
        _links:
          $ref: '#/components/schemas/SearchResultLinks'
        total:
          type: integer
    TopicDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12132
        name:
          type: string
          example: Topic name
        description:
          type: string
          example: Description
        internalIdentifier:
          type: string
          example: 'identifier for data exports for example: alcohol'
        status:
          type: string
          example: Active
    AgencyAdminResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854776000
          example: 684
        name:
          type: string
          maxLength: 100
          example: Suchtberatung Freiburg
        description:
          type: string
          maxLength: 65534
          example: 'Our agency provides help for the following topics: Lorem ipsum..'
        postcode:
          type: string
          minLength: 5
          maxLength: 5
          example: '79106'
        city:
          type: string
          maxLength: 100
          example: Bonn
        street:
          type: string
          maxLength: 255
          example: Musterstraße
        houseNumber:
          type: string
          maxLength: 20
          example: 12a
        floorBuilding:
          type: string
          maxLength: 100
          example: 2. OG, Haus B
        country:
          type: string
          maxLength: 100
          example: Deutschland
        phone:
          type: string
          maxLength: 30
          example: 0761 123456
        phoneSecondary:
          type: string
          maxLength: 30
          example: 0761 654321
        email:
          type: string
          maxLength: 255
          example: kontakt@beratungsstelle.de
        teamAgency:
          type: boolean
          example: false
        offline:
          type: boolean
          example: false
        consultingType:
          type: integer
          minimum: 0
          example: 1
        url:
          type: string
          maxLength: 500
          example: https://www.domain.com
        external:
          type: boolean
          example: false
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicDTO'
        demographics:
          $ref: '#/components/schemas/DemographicsDTO'
        createDate:
          type: string
          example: '2019-08-23T08:52:05'
        updateDate:
          type: string
          example: '2019-12-02T13:12:08'
        deleteDate:
          type: string
          example: '2020-09-02T15:53:23'
        counsellingRelations:
          type: array
          items:
            type: string
            enum:
              - RELATIVE_COUNSELLING
              - SELF_COUNSELLING
              - PARENTAL_COUNSELLING
        tenantId:
          type: integer
          format: int64
          example: 12
        dataProtection:
          type: object
          $ref: '#/components/schemas/DataProtectionDTO'
        agencyLogo:
          type: string
          example: base64 encoded image
        settings:
          $ref: '#/components/schemas/Settings'
