          enum:
            - DPP
            - IMPRINT
        label:
          type: string
        content:
          type: object
          description: Language code (e.g. de, en) to HTML text (multilingual map). Keys with the __meta suffix carry JSON translation metadata instead of HTML.
          additionalProperties:
            type: string
        publish:
          type: boolean
          description: true = mark PUBLISHED; false/absent = keep as DRAFT
          default: false
    UpdateLegalTextDTO:
      type: object
      required:
        - label
        - content
      properties:
        label:
          type: string
        content:
          type: object
