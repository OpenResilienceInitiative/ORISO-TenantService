openapi: 3.0.1
info:
  title: will be replaced
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
paths:
  /useradmin:
    get:
      tags:
        - root-controller
      summary: 'Returns the hal root entry point. [Authorization: Role: user-admin]'
      operationId: getRoot
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/RootDTO'
      security:
        - Bearer: []
  /useradmin/sessions:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns the list of sessions by filter query parameter. [Authorization: Role: user-admin]'
      operationId: getSessions
      parameters:
        - name: filter
          in: query
          description: The filter parameters to search for. If no filter is set all sessions are being returned. If more than one filter is set the first given filter is used only.
          schema:
            $ref: '#/components/schemas/SessionFilter'
        - name: page
          in: query
          description: Number of page where to start in the query (1 = first page)
          required: true
          schema:
            type: integer
        - name: perPage
          in: query
          description: Number of items which are being returned per page
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/SessionAdminResultDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/consultants:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns the list of consultants by filter query parameter. [Authorization: Role: consultant-admin]'
      operationId: getConsultants
      parameters:
        - name: filter
          in: query
          description: The filter parameters to search for. If no filter is set all consultant are being returned.
          schema:
            $ref: '#/components/schemas/ConsultantFilter'
        - name: page
          in: query
          description: Number of page where to start in the query (1 = first page)
          required: true
          schema:
            type: integer
        - name: perPage
          in: query
          description: Number of items which are being returned per page
          required: true
          schema:
            type: integer
        - name: sort
          in: query
          description: The sort parameter containing field and order the response should be sorted
          schema:
            $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ConsultantSearchResultDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    post:
      tags:
        - admin-user-controller
      summary: 'Creates a new consultant [Authorization: Role: consultant-admin]'
      operationId: createConsultant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsultantDTO'
        required: true
      responses:
        '201':
          description: CREATED - consultant was created successfully
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ConsultantAdminResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '409':
          description: CONFLICT - invalid/unavailable username or email address
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/consultants/{consultantId}:
    get:
      tags:
        - admin-user-controller
      summary: 'Get a consultant by given id [Authorization: Role: consultant-admin]'
      operationId: getConsultant
      parameters:
        - name: consultantId
          in: path
          description: consultant id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - consultant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultantAdminResponseDTO'
        '204':
          description: NO CONTENT - consultant with the specific id was not found
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    put:
      tags:
        - admin-user-controller
      summary: 'Updates a consultant [Authorization: Role: consultant-admin]'
      operationId: updateConsultant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminConsultantDTO'
        required: true
      parameters:
        - name: consultantId
          in: path
          description: consultant id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - consultant was updated successfully
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ConsultantAdminResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    delete:
      tags:
        - admin-user-controller
      summary: 'Mark a consultant for deletion [Authorization: Role: consultant-admin]'
      operationId: markConsultantForDeletion
      parameters:
        - name: consultantId
          in: path
          description: consultant id
          required: true
          schema:
            type: string
        - name: forceDeleteSessions
          in: query
          schema:
            type: boolean
          description: parameter specifying if consultant sessions need to be removed prior the deletion
      responses:
        '200':
          description: OK - consultant was marked for deletion successfully
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - consultant not found
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/askers/{askerId}:
    get:
      tags:
        - admin-user-controller
      summary: 'Get an asker by given id [Authorization: Role: consultant-admin]'
      operationId: getAsker
      parameters:
        - name: askerId
          in: path
          description: asker id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - asker found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskerResponseDTO'
        '204':
          description: NO CONTENT - asker with the specific id was not found
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    delete:
      tags:
        - admin-user-controller
      summary: 'Delete a asker by given id [Authorization: Role: consultant-admin]'
      operationId: markAskerForDeletion
      parameters:
        - name: askerId
          in: path
          description: asker id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - asker was marked for deletion successfully
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - asker not found
        '409':
          description: CONFLICT - asker is already marked for deletion
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/report:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns an generated report containing data integration violations. [Authorization: Role: user-admin]'
      operationId: generateViolationReport
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViolationDTO'
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/agencies/{agencyId}/consultants:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns the list of consultants for a given agency Id. [Authorization: Role: user-admin]'
      operationId: getAgencyConsultants
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AgencyConsultantResponseDTO'
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - agency with given id does not exist
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/consultants/{consultantId}/agencies:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns the list of agencies for a given consultant Id. [Authorization: Role: user-admin]'
      operationId: getConsultantAgencies
      parameters:
        - name: consultantId
          in: path
          description: Consultant Id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ConsultantAgencyResponseDTO'
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '404':
          description: NOT FOUND - consultant with given id does not exist
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    post:
      tags:
        - admin-user-controller
      summary: 'Create a consultant-agency relation [Authorization: Role: user-admin]'
      operationId: createConsultantAgency
      parameters:
        - name: consultantId
          in: path
          description: Consultant Id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsultantAgencyDTO'
        required: true
      responses:
        '201':
          description: CREATED - consultant-agency relation was created successfully
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    put:
      tags:
        - admin-user-controller
      summary: 'Set consultant-agency relations [Authorization: Role: user-admin]'
      operationId: setConsultantAgencies
      description: Existing relations are deleted, passed relations added.
      parameters:
        - name: consultantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateConsultantAgencyDTO'
        required: true
      responses:
        '200':
          description: OK - consultant-agency relations have been set
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/consultants/{consultantId}/agencies/{agencyId}:
    delete:
      tags:
        - admin-user-controller
      summary: 'Delete a consultant-agency relation [Authorization: Role: user-admin]'
      operationId: deleteConsultantAgency
      parameters:
        - name: consultantId
          in: path
          description: Consultant Id
          required: true
          schema:
            type: string
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK - consultant-agency relation was deleted successfully
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/agency/{agencyId}/changetype:
    post:
      tags:
        - admin-user-controller
      summary: 'Change an agency from team-agency to default and vice-versa and switch the associated consultant accounts to team consultant or default consultant. Ongoing team counselings change to 1:1 when converting agency to default status. 1:1 counselings remain single counselings when swapping the agency to team-agency. This endpoint must be used only internally from AgencyService to ensure the regarding agency has been flagged correctly too. [Authorization: Role: user-admin]'
      operationId: changeAgencyType
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyTypeDTO'
      responses:
        '200':
          description: OK - assigned consultants were changed successfully
        '400':
          description: BAD REQUEST - invalid/incomplete request
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/agencyadmins:
    get:
      tags:
        - admin-user-controller
      summary: 'Returns the list of agency admins by filter query parameter. [Authorization: Role: user-admin]'
      operationId: getAgencyAdmins
      parameters:
        - name: filter
          in: query
          description: The filter parameters to search for. If no filter is set all admins are being returned.
          schema:
            $ref: '#/components/schemas/AdminFilter'
        - name: page
          in: query
          description: Number of page where to start in the query (1 = first page)
          required: true
          schema:
            type: integer
        - name: perPage
          in: query
          description: Number of items which are being returned per page
          required: true
          schema:
            type: integer
        - name: sort
          in: query
          description: The sort parameter containing field and order the response should be sorted
          schema:
            $ref: '#/components/schemas/Sort'
      responses:
        '200':
          description: OK - successfull operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AdminSearchResultDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
    post:
      tags:
        - admin-user-controller
      summary: 'Creates a new Agency Admin [Authorization: Role: user-admin]'
      operationId: createAgencyAdmin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminDTO'
        required: true
      responses:
        '201':
          description: CREATED - Agency Admin was created successfully
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AdminResponseDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '409':
          description: CONFLICT - invalid/unavailable username or email address
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/agencyadmins/search:
    get:
      tags:
        - admin-user-controller
      summary: 'Get Agency admins matching the given query [Auth: user-admin]'
      operationId: searchAgencyAdmins
      parameters:
        - name: query
          in: query
          description: URL-encoded infix to search for in id first name, last name, or email. A non-encoded star symbol searches for all.
          required: true
          schema:
            type: string
            minLength: 1
        - name: page
          in: query
          description: Page number (first page = 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: perPage
          in: query
          description: Number of items returned per page
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: field
          in: query
          description: field to sort by
          schema:
            type: string
            enum:
              - FIRSTNAME
              - LASTNAME
              - EMAIL
              - UPDATE_DATE
            default: FIRSTNAME
            pattern: ^(FIRSTNAME|LASTNAME|EMAIL|UPDATE_DATE)$
        - name: order
          in: query
          description: sort order
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: ASC
            pattern: ^(ASC|DESC)$
      responses:
        '200':
          description: OK - successful operation
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/AdminSearchResultDTO'
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid role/authorization
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: []
  /useradmin/agencyadmins/{adminId}:
