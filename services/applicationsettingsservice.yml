openapi: 3.0.1
info:
  title: Definition for Application Settings API
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
paths:
  /settings:
    get:
      tags:
        - applicationsettings-controller
      summary: Get all application settings
      operationId: getApplicationSettings
      responses:
        '200':
          description: OK - successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsDTO'
        '204':
          description: NO CONTENT - no content found
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid Keycloak token
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /settingsadmin:
    patch:
      tags:
        - applicationsettings-controller
      summary: Patch application settings
      operationId: patchApplicationSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSettingsPatchDTO'
      responses:
        '200':
          description: OK - successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsDTO'
        '204':
          description: NO CONTENT - no content found
        '400':
          description: BAD REQUEST - invalid/incomplete request or body object
        '401':
          description: UNAUTHORIZED - no/invalid Keycloak token
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /settingsadmin/smtp-credentials:
    get:
      tags:
        - applicationsettings-controller
      summary: Get global SMTP credentials (super admin only)
      operationId: getGlobalSmtpCredentials
      responses:
        '200':
          description: OK - successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSettingsSmtpCredentialsDTO'
        '204':
          description: NO CONTENT - no content found
        '401':
          description: UNAUTHORIZED - no/invalid Keycloak token
        '403':
          description: FORBIDDEN - insufficient permissions
        '500':
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
components:
  schemas:
    ApplicationSettingsDTO:
      type: object
      required:
        - multitenancyWithSingleDomainEnabled
        - multitenancyEnabled
      properties:
        multitenancyWithSingleDomainEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        multitenancyEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        useTenantService:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        useConsultingTypesForAgencies:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        enableWalkthrough:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        disableVideoAppointments:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        mainTenantSubdomainForSingleDomainMultitenancy:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        useOverviewPage:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        calcomUrl:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        budibaseAuthClientId:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        budibaseUrl:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        calendarAppUrl:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        legalContentChangesBySingleTenantAdminsAllowed:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        documentationEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalFeatureSystemNotificationEmailsEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalSmtpEnabled:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalSmtpHost:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        globalSmtpPort:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        globalSmtpSecure:
          allOf:
            - $ref: '#/components/schemas/FeatureToggleDTO'
        globalSmtpFrom:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        globalSmtpEmailThemeColor:
          allOf:
            - $ref: '#/components/schemas/SettingDTO'
        releaseToggles:
          type: object
          additionalProperties:
            type: object
    ApplicationSettingsPatchDTO:
      type: object
      properties:
        legalContentChangesBySingleTenantAdminsAllowed:
          type: boolean
        mainTenantSubdomainForSingleDomainMultitenancy:
          type: string
        globalFeatureSystemNotificationEmailsEnabled:
          type: boolean
        globalSmtpEnabled:
          type: boolean
        globalSmtpHost:
          type: string
        globalSmtpPort:
          type: string
        globalSmtpSecure:
          type: boolean
        globalSmtpUsername:
          type: string
        globalSmtpPassword:
          type: string
        globalSmtpFrom:
          type: string
        globalSmtpEmailThemeColor:
          type: string
    ApplicationSettingsSmtpCredentialsDTO:
      type: object
      properties:
        globalSmtpUsername:
          type: string
        globalSmtpPassword:
          type: string
    FeatureToggleDTO:
      type: object
      required:
        - value
        - readOnly
      properties:
        value:
          type: boolean
          example: true
        readOnly:
          type: boolean
          example: false
    SettingDTO:
      type: object
      required:
        - value
        - readOnly
      properties:
        value:
          type: string
          example: true
        readOnly:
          type: boolean
          example: false
