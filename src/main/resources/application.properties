# Logging: SLF4J (via Lombok)
spring.application.name=tenant-service
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.springframework.security=INFO
logging.level.com.vi.tenantservice=DEBUG

spring.main.allow-bean-definition-overriding=true
springfox.enabled=false

# Keycloak

keycloak.disable-trust-manager=true
keycloak.bearer-only=true
keycloak.resource=tenant-service
keycloak.principal-attribute=
keycloak.cors=false

tenant.cors.enabled=${TENANT_CORS_ENABLED:false}
tenant.cors.allowed.origins=${TENANT_CORS_ALLOWED_ORIGINS:}
tenant.cors.allowed.paths=${TENANT_CORS_ALLOWED_PATHS:/tenant/public/**}

app.base.url=

# ---------------- Machine translation (legal texts) ----------------
# Provider API keys are stored as platform-global admin settings (tenant_admin_controls),
# managed via /tenantadmin/translation/keys - only the endpoints and model defaults live here.
translation.openrouter.base-url=${TRANSLATION_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
translation.openrouter.model=${TRANSLATION_OPENROUTER_MODEL:openai/gpt-4o-mini}
translation.mistral.base-url=${TRANSLATION_MISTRAL_BASE_URL:https://api.mistral.ai/v1}
translation.mistral.model=${TRANSLATION_MISTRAL_MODEL:mistral-small-latest}
translation.connect-timeout-ms=${TRANSLATION_CONNECT_TIMEOUT_MS:5000}
translation.read-timeout-ms=${TRANSLATION_READ_TIMEOUT_MS:60000}

# Springfox/API documentation
springfox.docuTitle=TenantService
springfox.docuDescription=Provides a REST API service to provide tenant information and actions.
springfox.docuVersion=0.0.1
springfox.docuTermsUrl=
springfox.docuContactName=
springfox.docuContactUrl=
springfox.docuContactEmail=
springfox.docuLicense=Apache 2.0
springfox.docuLicenseUrl=http://www.apache.org/licenses/LICENSE-2.0.html
springfox.docuPath=/tenantService/docs
springfox.documentation.swagger.v2.path=${springfox.docuPath}/v2/api-docs

#MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.idle-timeout=500000
spring.datasource.hikari.maxLifetime=500000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect


# ---------------- MariaDB ----------------
# Configuration must be provided via ConfigMap/Secrets (environment variables)
# Use Kubernetes DNS names, e.g., jdbc:mariadb://mariadb.caritas.svc.cluster.local:3306/tenantservice
# NOT hardcoded IPs like jdbc:mariadb://10.43.123.72:3306/tenantservice
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
server.port = 8081
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

feature.multitenancy.with.single.domain.enabled=false
# Use Kubernetes DNS names, e.g., http://consultingtypeservice.caritas.svc.cluster.local:8083
consulting.type.service.api.url=${CONSULTING_TYPE_SERVICE_API_URL:}

csrf.header.property=X-CSRF-Token
csrf.cookie.property=CSRF-TOKEN
csrf.whitelist.adminUris=/tenantadmin,/tenantadmin/,/tenantadmin/**,/service/tenantadmin,/service/tenantadmin/,/service/tenantadmin/**

default.consulting.types.json.path=
default.tenant.settings.json.path=
# Use Kubernetes DNS names, e.g., http://userservice.caritas.svc.cluster.local:8082
user.service.api.url=${USER_SERVICE_API_URL:}
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.cache.jcache.config=classpath:ehcache.xml

# Use Kubernetes DNS names, e.g., http://keycloak.caritas.svc.cluster.local:8080/realms/online-beratung
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
spring.jwt.auth.converter.resource-id: app
spring.jwt.auth.converter.principal-attribute: preferred_username
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

template.use.custom.resources.path=false
template.custom.resources.path=false

# ---------------- Tracing / Metrics (OpenTelemetry via SigNoz OTLP collector) ----------------
# management.tracing.enabled is NOT a real property in Spring Boot 4.0.1: the
# top-level TracingProperties class (management.tracing.*) has no "enabled"
# field (only sampling/baggage/propagation) - see
# org.springframework.boot.micrometer.tracing.autoconfigure.TracingProperties
# at the v4.0.1 tag. Setting it was a silent no-op; removed rather than left
# as a misleading kill switch. Whether ANY span gets created at all is gated
# purely by classpath presence of the tracing autoconfiguration modules
# (spring-boot-micrometer-tracing / spring-boot-micrometer-tracing-opentelemetry,
# see pom.xml) - which this service was missing entirely, producing zero spans
# regardless of this property's value.
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:}
management.tracing.export.otlp.enabled=${MANAGEMENT_OTLP_TRACING_ENABLED:false}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:}
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
# traceId/spanId (from Micrometer Tracing MDC) are now carried as JSON fields by
# logback-spring.xml's "log.trace" block instead of via a text logging pattern.
