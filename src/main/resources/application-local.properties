# Logging: SLF4J (via Lombok)
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.keycloak.adapters=DEBUG

# Keycloak
# Use Kubernetes DNS names, e.g., http://keycloak.caritas.svc.cluster.local:8080
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=online-beratung
keycloak.bearer-only=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/online-beratung
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/online-beratung/protocol/openid-connect/certs

# MariaDB
# Use Kubernetes DNS names, e.g., jdbc:mariadb://10.43.34.188:3306/tenantservice
# NOT hardcoded IPs like jdbc:mariadb://10.43.34.188:3306/tenantservice
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/tenantservice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tenantservice}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Liquibase — enabled locally so dev environments bootstrap from changesets automatically.
# SPRING_LIQUIBASE_ENABLED is the env-var kill switch (default: enabled).
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.change-log=classpath:db/changelog/tenantservice-master.xml
spring.liquibase.contexts=${SPRING_LIQUIBASE_CONTEXTS:seed}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.port = 8081
feature.multitenancy.with.single.domain.enabled=false
keycloak.ssl-required=none

consulting.type.service.api.url=http://localhost:8083
user.service.api.url=http://localhost:8082
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
# Local only: the public provider endpoints, so machine translation works on a developer machine.
translation.openrouter.base-url=https://openrouter.ai/api/v1
translation.mistral.base-url=https://api.mistral.ai/v1

# Keycloak subject (sub) of the UserService technical service identity (ORISO-Helm#367).
# Local/test value only.
technical.service.subject=00000000-0000-0000-0000-000000000000
