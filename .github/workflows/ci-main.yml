name: CI - Main

on:
  push:
    branches:
      - main
      - dev
      - pre-dev

      - 'speed/**'
env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative
  IMAGE_NAME: oriso-tenantservice

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Compile and Package Java application
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Create and Publish Docker image
      id: image
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: true
        image_name: ${{ env.IMAGE_NAME }}
        github_token: ${{ secrets.GITHUB_TOKEN }}

  attest-dev:
    name: Sign the published Dev image
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Sign and publish the image provenance attestation
      uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ needs.build.outputs.digest }}
        push-to-registry: true
        create-storage-record: false

  # The former non-blocking `integration-tests` burn-in job was folded into the
  # blocking `build` job above: `maven-build` now runs `mvnw -B verify`, so the
  # surefire `integration-tests` execution (**/*IT.*) is part of the main gate
  # (burn-in green since 2026-07-05; flipped 2026-07-07).
