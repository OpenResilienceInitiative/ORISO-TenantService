name: CI - Pull Request

on:
  pull_request:

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  validate:
    name: test, build and Docker validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Compile and Package Java application
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Create Docker image
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: false
        image_name: oriso-tenantservice
        github_token: ${{ secrets.GITHUB_TOKEN }}

  # The former non-blocking `integration-tests` burn-in job was folded into the
  # blocking `validate` job above: `maven-build` now runs `mvnw -B verify`, so the
  # surefire `integration-tests` execution (**/*IT.*) is a required part of the
  # main gate (burn-in green since 2026-07-05; flipped 2026-07-07).

  contract-tests:
    name: CI contract tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install pinned test dependencies
      run: python -m pip install --disable-pip-version-check pytest==9.0.2

    - name: Verify the required-CI contract holds
      run: python -m pytest -q tests/ci

  required-ci:
    name: required PreDev CI
    if: always()
    needs: [validate, contract-tests]
    runs-on: ubuntu-latest

    steps:
    - name: Report aggregate required conclusion to SigNoz
      env:
        REPO: ${{ github.event.repository.name }}
        WORKFLOW: ${{ github.workflow }}
        VALIDATE_RESULT: ${{ needs.validate.result }}
        CONTRACT_RESULT: ${{ needs.contract-tests.result }}
      run: |
        conclusion=success
        if [[ "${VALIDATE_RESULT}" != success || "${CONTRACT_RESULT}" != success ]]; then
          conclusion=failure
        fi
        now_ns="$(date +%s)000000000"
        payload="{\"resourceMetrics\":[{\"resource\":{\"attributes\":[{\"key\":\"service.name\",\"value\":{\"stringValue\":\"ci-cd\"}}]},\"scopeMetrics\":[{\"scope\":{\"name\":\"ci-health\"},\"metrics\":[{\"name\":\"ci_run_result\",\"sum\":{\"dataPoints\":[{\"attributes\":[{\"key\":\"repo\",\"value\":{\"stringValue\":\"${REPO}\"}},{\"key\":\"workflow\",\"value\":{\"stringValue\":\"${WORKFLOW}\"}},{\"key\":\"conclusion\",\"value\":{\"stringValue\":\"${conclusion}\"}}],\"startTimeUnixNano\":\"${now_ns}\",\"timeUnixNano\":\"${now_ns}\",\"asInt\":\"1\"}],\"aggregationTemporality\":2,\"isMonotonic\":true}}]}]}]}"
        curl --fail-with-body --silent --show-error \
          -X POST "https://signoz.oriso-dev.site/v1/metrics" \
          -H "Content-Type: application/json" \
          -d "${payload}" \
          || echo "::warning::Failed to POST aggregate CI health metric to SigNoz"
        if [[ "${conclusion}" != success ]]; then
          echo "::error::Required CI failed: validate=${VALIDATE_RESULT}, contract=${CONTRACT_RESULT}"
          exit 1
        fi

  # Non-blocking OpenAPI contract diff: flags breaking changes to this service's
  # own vendored spec (api/tenantservice.yaml) between the PR base and head.
  # Informational for now; flip to blocking once the process around intentional
  # breaking changes (version bump / consumer sign-off) is agreed.
  api-contract-diff:
    name: api-contract-diff (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout PR head
      uses: actions/checkout@v6

    - name: Checkout base branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.base_ref }}
        path: .base

    - name: Diff own OpenAPI specs against base (oasdiff breaking)
      shell: bash
      run: |
        shopt -s nullglob
        status=0
        for spec in api/*.yaml api/*.yml; do
          if [ -f ".base/$spec" ]; then
            echo "::group::oasdiff breaking $spec"
            docker run --rm -v "$PWD:/work:ro" tufin/oasdiff:latest \
              breaking "/work/.base/$spec" "/work/$spec" --fail-on WARN || status=1
            echo "::endgroup::"
          else
            echo "Skipping $spec (new on this branch, nothing to diff against)"
          fi
        done
        if [ "$status" -ne 0 ]; then
          echo "::warning::oasdiff found (formally) breaking API spec changes - report-only; see the log groups above. Flip to a hard failure once the breaking-change process is agreed."
          echo "### api-contract-diff: breaking changes detected (report-only)" >> "$GITHUB_STEP_SUMMARY"
        fi
