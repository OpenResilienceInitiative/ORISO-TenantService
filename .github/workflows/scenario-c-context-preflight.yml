name: Scenario C context source preflight

on:
  push:
    branches: [codex/367-c-context-tenant-20261021]

permissions:
  contents: read

concurrency:
  group: scenario-c-context-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: tenant
            source: .
            repository: OpenResilienceInitiative/ORISO-TenantService
            ref: ''
          - role: cts
            source: subject
            repository: OpenResilienceInitiative/ORISO-ConsultingTypeService
            ref: 72a4026eea320db2cac68192b8ae9a011a0b4eaf
          - role: user
            source: subject
            repository: OpenResilienceInitiative/ORISO-UserService
            ref: 461f5a684c62108e3881905f49be251251e88c28
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAVEN_OPTS: -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the exact public receiver or caller source
        if: matrix.role != 'tenant'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: subject
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: ${{ matrix.source }}/pom.xml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Compile current production and tests, then execute affected units
        env:
          PREFLIGHT_ROLE: ${{ matrix.role }}
          PREFLIGHT_SOURCE: ${{ matrix.source }}
          PREFLIGHT_REF: ${{ matrix.ref || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/scenario-c-context-preflight.py "$PREFLIGHT_ROLE" \
            --source "$PREFLIGHT_SOURCE" --expected "$PREFLIGHT_REF" \
            --evidence "proof-reports/$PREFLIGHT_ROLE"
      - name: Retain current source, toolchain, compiler and unit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenario-c-context-preflight-${{ matrix.role }}
          path: proof-reports/${{ matrix.role }}/**
          if-no-files-found: error
          retention-days: 14
