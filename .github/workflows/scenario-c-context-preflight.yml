name: Scenario C context source preflight

on:
  push:
    branches: [codex/367-c-context-tenant-20261021, codex/367-c-c16-roundtrip-20261022]

permissions:
  contents: read

concurrency:
  group: scenario-c-context-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: tenant
            source: .
            repository: OpenResilienceInitiative/ORISO-TenantService
            ref: ''
          - role: cts
            source: subject
            repository: OpenResilienceInitiative/ORISO-ConsultingTypeService
            ref: 061dff805daaed39065e39f3b36dfb0da5628ea6
          - role: user
            source: subject
            repository: OpenResilienceInitiative/ORISO-UserService
            ref: 8aab24d613ec7772500d6de448c3be1dc887881e
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MAVEN_OPTS: -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the exact public receiver or caller source
        if: matrix.role != 'tenant'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: subject
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: ${{ matrix.source }}/pom.xml
      - name: Keep evidence and dependency checkout outside the immutable host source
        env:
          PREFLIGHT_ROLE: ${{ matrix.role }}
        run: |
          if [ "$PREFLIGHT_ROLE" = tenant ]; then
            printf 'PREFLIGHT_SOURCE_PATH=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            mv subject "$RUNNER_TEMP/context-preflight-subject"
            printf 'PREFLIGHT_SOURCE_PATH=%s\n' "$RUNNER_TEMP/context-preflight-subject" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Compile current production and tests, then execute affected units
        id: source-check
        env:
          PREFLIGHT_ROLE: ${{ matrix.role }}
          PREFLIGHT_REF: ${{ matrix.ref || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/scenario-c-context-preflight.py "$PREFLIGHT_ROLE" \
            --source "$PREFLIGHT_SOURCE_PATH" --expected "$PREFLIGHT_REF" \
            --evidence "$RUNNER_TEMP/context-preflight-$PREFLIGHT_ROLE"
      - name: Produce only a scoped mechanical proposal after confirmed formatter failure
        if: failure()
        env:
          PREFLIGHT_ROLE: ${{ matrix.role }}
        run: |
          python scripts/ci/scenario-c-c16-format-proposal.py "$PREFLIGHT_ROLE" \
            --source "$PREFLIGHT_SOURCE_PATH" --source-evidence "$RUNNER_TEMP/context-preflight-$PREFLIGHT_ROLE"
      - name: Retain current source, toolchain, compiler and unit receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenario-c-context-preflight-${{ matrix.role }}
          path: ${{ runner.temp }}/context-preflight-${{ matrix.role }}/**
          if-no-files-found: error
          retention-days: 14
