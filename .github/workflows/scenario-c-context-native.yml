name: Scenario C native bootstrap counterfactual

on:
  push:
    branches: [codex/367-c-context-tenant-20261021]

permissions:
  contents: read

concurrency:
  group: scenario-c-native-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-bootstrap-counterfactual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: caller
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: caller
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the fixed real CTS receiver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: OpenResilienceInitiative/ORISO-ConsultingTypeService
          ref: 0af6b5d4612b61c608dc23724fd1932de2fc45e1
          path: receiver
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the fixed canonical native account fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: OpenResilienceInitiative/ORISO-Helm
          ref: ab13d41e56f077ca85d1412e9eba2e6816554d9d
          path: helm
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: |
            caller/pom.xml
            receiver/pom.xml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Verify the resource and failure classifiers without native resources
        run: python -m unittest discover -s scripts/tests -p test_native_context_resources.py -q > "$RUNNER_TEMP/ctx-resource-controls.txt" 2>&1
      - name: Compile ordinary sources before disposable actual HTTP execution
        run: |
          python scripts/ci/scenario-c-context-native.py \
            --receiver ../receiver --receiver-ref 0af6b5d4612b61c608dc23724fd1932de2fc45e1 \
            --helm ../helm --helm-ref ab13d41e56f077ca85d1412e9eba2e6816554d9d \
            --expect red --evidence "$RUNNER_TEMP/scenario-c-context-native"
      - name: Retain only source hashes, sanitized measurements and original safe XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenario-c-native-bootstrap-counterfactual
          path: |
            ${{ runner.temp }}/ctx-resource-controls.txt
            ${{ runner.temp }}/scenario-c-context-native/source-receipt.json
            ${{ runner.temp }}/scenario-c-context-native/native/*.json
            ${{ runner.temp }}/scenario-c-context-native/native/*.jsonl
            ${{ runner.temp }}/scenario-c-context-native/native/*.xml
          if-no-files-found: error
          retention-days: 14
