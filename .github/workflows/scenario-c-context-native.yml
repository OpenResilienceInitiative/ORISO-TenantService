name: Scenario C native bootstrap counterfactual

on:
  pull_request:
    branches: [dev]
  push:
    branches: [codex/367-c-context-tenant-20261021, codex/367-c-c16-roundtrip-20261022, dev]

permissions:
  contents: read

concurrency:
  group: scenario-c-native-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-bootstrap-counterfactual:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: caller
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: caller
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the fixed real CTS receiver
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: OpenResilienceInitiative/ORISO-ConsultingTypeService
          ref: e5cd83bec1f76996e0ec0dbb9f95742dd106cf6e
          path: receiver
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the fixed canonical native account fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: OpenResilienceInitiative/ORISO-Helm
          ref: 0aa24d051e46cfe799e010aa3a4c78529fb4e8dc
          path: helm
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: |
            caller/pom.xml
            receiver/pom.xml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Install and verify the selected native fixture's declared dependency
        run: |
          python - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          available = importlib.util.find_spec("yaml") is not None
          Path(os.environ["RUNNER_TEMP"], "ctx-python-dependencies.json").write_text(
              json.dumps({"preexistingPyYAML": available, "required": "PyYAML==6.0.3"}) + "\n")
          PY
          python -m pip install --disable-pip-version-check -r ../helm/requirements-ci.txt
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          assert yaml.__version__ == "6.0.3"
          sys.path.insert(0, str(Path("../helm/tests").resolve()))
          import _keycloak_container, scenario_c_receiver_fixture
          print("Both selected native helper imports passed; no native resource was started")
          PY
      - name: Verify the resource and failure classifiers without native resources
        run: |
          python -m unittest discover -s scripts/tests -p test_native_context_resources.py -q > "$RUNNER_TEMP/ctx-resource-controls.txt" 2>&1
          python -m unittest discover -s scripts/tests -p test_bootstrap_baseline.py -q >> "$RUNNER_TEMP/ctx-resource-controls.txt" 2>&1
          python -m unittest discover -s scripts/tests -p test_native_memory_attribution.py -q >> "$RUNNER_TEMP/ctx-resource-controls.txt" 2>&1
          python -m unittest discover -s scripts/tests -p test_native_diagnostic_frames.py -q >> "$RUNNER_TEMP/ctx-resource-controls.txt" 2>&1
          python -m unittest discover -s scripts/tests -p test_paired_bootstrap_native.py -q >> "$RUNNER_TEMP/ctx-resource-controls.txt" 2>&1
      - name: Compile ordinary sources before disposable actual HTTP execution
        run: |
          python scripts/ci/scenario-c-context-native.py \
            --receiver ../receiver --receiver-ref e5cd83bec1f76996e0ec0dbb9f95742dd106cf6e \
            --helm ../helm --helm-ref 0aa24d051e46cfe799e010aa3a4c78529fb4e8dc \
            --expect green --expected-tests 3 --v1-baseline compensated-routed-policy --evidence "$RUNNER_TEMP/scenario-c-context-native"
      - name: Retain only source hashes, sanitized measurements and original safe XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenario-c-native-bootstrap-counterfactual
          path: |
            ${{ runner.temp }}/ctx-resource-controls.txt
            ${{ runner.temp }}/ctx-python-dependencies.json
            ${{ runner.temp }}/scenario-c-context-native/source-receipt.json
            ${{ runner.temp }}/scenario-c-context-native/native/*.json
            ${{ runner.temp }}/scenario-c-context-native/native/*.jsonl
            ${{ runner.temp }}/scenario-c-context-native/native/*.xml
          if-no-files-found: error
          retention-days: 14
