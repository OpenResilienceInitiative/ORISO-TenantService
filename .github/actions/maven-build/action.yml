name: Reusable Maven validation and build steps

inputs:
  java_version:
    required: true

runs:
  using: 'composite'
  steps:
  - name: Set up JDK and Maven
    uses: actions/setup-java@v5
    with:
      java-version: ${{ inputs.java_version }}
      distribution: 'temurin'
      cache: maven

  # Blocking test gate (Test Quality Audit 2026-07-04, item 3; flipped from
  # `test` to `verify` after burn-in went green — full local+CI `verify` runs
  # 2026-07-05..07-07: 302 tests, 0 failures, 0 errors).
  # Runs BOTH surefire executions: `unit-tests` (test phase, **/*Test) and
  # `integration-tests` (integration-test phase, **/*IT.*), then fails the build
  # if any report shows failures/errors — or if NO reports / zero tests were
  # produced (a green build with zero reports means tests were silently skipped).
  # failsafe-reports is globbed too in case a module adopts failsafe later.
  - name: Run Maven tests (unit + integration)
    shell: bash
    run: |
      ./mvnw -B verify
      python3 - <<'PY'
      from pathlib import Path
      import sys
      import xml.etree.ElementTree as ET

      reports = sorted(Path(".").glob("**/target/surefire-reports/TEST-*.xml"))
      reports += sorted(Path(".").glob("**/target/failsafe-reports/TEST-*.xml"))
      if not reports:
          print("::error::Zero test reports found — tests were silently skipped or never ran.")
          sys.exit(1)

      total_tests = 0
      failing_reports = []
      for report in reports:
          root = ET.parse(report).getroot()
          total_tests += int(root.attrib.get("tests", 0))
          failures = int(root.attrib.get("failures", 0))
          errors = int(root.attrib.get("errors", 0))
          if failures or errors:
              failing_reports.append((report, failures, errors))

      print(f"Parsed {len(reports)} test report(s), {total_tests} tests.")
      if total_tests == 0:
          print("::error::Test reports contain zero executed tests.")
          sys.exit(1)

      if failing_reports:
          print("Maven reported test failures/errors:")
          for report, failures, errors in failing_reports:
              print(f"- {report}: failures={failures}, errors={errors}")
          sys.exit(1)
      PY

  # jacoco:report is bound to the `test` phase behind surefire, so a green suite has
  # already written the report and this step has nothing to do. Only a red suite halts
  # the build before the goal, and only then is it invoked directly against the
  # execution data the prepare-agent JVM left behind.
  #
  # That direct invocation is best-effort: run from the command line the goal resolves
  # the plugin's reporting dependencies, which the lifecycle-bound execution never needs
  # and which do not reliably resolve from a restored runner cache. Coverage is a
  # diagnostic, so failing to produce it must never fail the build.
  - name: Generate coverage report
    if: ${{ always() }}
    shell: bash
    run: |
      if [ -f target/site/jacoco/jacoco.csv ]; then
        echo "Coverage report already written during the test phase."
      elif [ -f target/jacoco.exec ]; then
        # Bounded, because `|| echo` only catches a nonzero exit — not a hang.
        # This goal resolves the plugin's reporting dependencies from the
        # network and no job here sets timeout-minutes, so a stalled resolve
        # would sit until GitHub's 6h default. `timeout` exits 124 on expiry,
        # which the same `||` already handles.
        timeout --signal=TERM 5m ./mvnw -B jacoco:report \
          || echo "Standalone jacoco:report failed or timed out; coverage is unavailable for this run."
      else
        echo "No target/jacoco.exec: the run did not reach the test phase."
      fi

  - name: Report coverage
    if: ${{ always() }}
    shell: bash
    run: |
      set -o pipefail
      {
        echo "### Coverage"
        echo
        python3 scripts/ci/coverage-summary.py
      } | tee -a "$GITHUB_STEP_SUMMARY"

  # The summary carries totals and a per-package breakdown. Per-class and per-line
  # detail lives in the HTML report, which is too large to inline.
  - name: Upload coverage report
    if: ${{ always() }}
    uses: actions/upload-artifact@v4
    with:
      name: jacoco-coverage-report
      path: target/site/jacoco
      if-no-files-found: ignore
      retention-days: 14

  - name: Package Java application
    shell: bash
    run: ./mvnw -B package -DskipTests
