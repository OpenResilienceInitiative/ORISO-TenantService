name: Reusable Docker build, scan and publish steps

inputs:
  push_to_ghcr:
    description: Whether to publish the image to GHCR
    required: true
  image_name:
    description: GHCR image name without the registry and organization
    required: true
  github_token:
    description: GitHub token used only to publish to GHCR
    required: true
  image_tags:
    description: Explicit image tags for a versioned release
    default: ''
  image_labels:
    description: Explicit OCI labels for a versioned release
    default: ''

runs:
  using: 'composite'
  steps:
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Extract Metadata
    id: meta
    if: ${{ inputs.image_tags == '' }}
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}
        type=raw,value=speed-16aug,enable=${{ github.ref == 'refs/heads/speed/reflux-progress-exp-16-aug' }}

  # Both builds use the Maven output in the same context, on the same builder
  # and platform. Only the local Docker exporter needs attestations disabled.
  - name: Build image locally for scanning
    uses: docker/build-push-action@v7
    with:
      context: .
      platforms: linux/amd64
      push: false
      load: true
      provenance: false
      sbom: false
      tags: ${{ inputs.image_name }}:ci-scan
      labels: ${{ inputs.image_labels || steps.meta.outputs.labels }}
      cache-from: type=gha,scope=${{ inputs.image_name }}
      cache-to: ${{ inputs.push_to_ghcr != 'true' && format('type=gha,mode=max,scope={0}', inputs.image_name) || '' }}

  - name: Reject fixable high or critical image vulnerabilities
    uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
    with:
      image-ref: ${{ inputs.image_name }}:ci-scan
      format: table
      exit-code: '1'
      ignore-unfixed: true
      vuln-type: os,library
      severity: CRITICAL,HIGH

  - name: Login to GitHub Container Registry
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}

  - name: Build and publish Docker image
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/build-push-action@v7
    with:
      context: .
      platforms: linux/amd64
      push: true
      tags: ${{ inputs.image_tags || steps.meta.outputs.tags }}
      labels: ${{ inputs.image_labels || steps.meta.outputs.labels }}
      cache-from: type=gha,scope=${{ inputs.image_name }}
      cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

  - name: Build Summary
    shell: bash
    env:
      IMAGE: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      TAGS: ${{ inputs.image_tags || steps.meta.outputs.tags }}
    run: |
      {
        echo '### Docker Build Summary'
        echo '✅ **Status:** Build and image scan passed'
        echo "📦 **Image:** \`$IMAGE\`"
        echo '🏷️ **Tags:**'
        echo '```'
        echo "$TAGS"
        echo '```'
        echo
      } >> "$GITHUB_STEP_SUMMARY"
