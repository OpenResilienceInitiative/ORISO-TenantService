name: Reusable Docker Build and Publish steps

inputs:
  push_to_ghcr: 
    required: true
    type: boolean
  image_name: 
    required: true
    type: string
  github_token:
    required: true
    type: string

outputs:
  digest:
    description: Immutable image digest of the built image
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Login to GitHub Container Registry
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}
    
  - name: Extract Metadata
    id: meta
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}
      
  - name: Build and Push Docker image
    id: build
    uses: docker/build-push-action@v7
    with:
      context: .
      push: ${{ inputs.push_to_ghcr }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      # Scope the GHA cache per image so images built from this shared action
      # can't collide on one cache namespace — future-proofs against a second
      # image being added (root cause of OpenResilienceInitiative/ORISO-Admin#424).
      cache-from: type=gha,scope=${{ inputs.image_name }}
      cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
  
  - name: Build Summary
    shell: bash
    run: |
      echo "### Docker Build Summary" >> $GITHUB_STEP_SUMMARY
      if [ "${{ steps.build.outcome }}" == "success" ]; then
        echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
        echo "📦 **Image:** \`${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "🏷️ **Tags:**" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
      else
        echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
        echo "Please check the build logs for details." >> $GITHUB_STEP_SUMMARY
      fi
      echo "" >> $GITHUB_STEP_SUMMARY
