      type: object
      required:
        - id
        - name
        - subdomain
      properties:
        id:
          type: integer
          format: int64
          example: 12132
        name:
          type: string
          example: "Company name AG"
          maxLength: 40
        subdomain:
          type: string
          example: "companyname"
          maxLength: 100
        address:
          type: string
          maxLength: 255
          example: "Musterstraße 1, 12345 Musterstadt"
        description:
          type: string
          example: "Short description of the tenant."
        beraterCount:
          type: integer
          example: 10
        adminEmails:
          type: array
          items:
            type: string
          example: "[admin1@ob.de, admin2@ob.de]"
        createDate:
          type: string
        updateDate:
          type: string

    TenantsSearchResultDTO:
      type: object
      properties:
        _embedded:
          type: array
          items:
            $ref: '#/components/schemas/AdminTenantDTO'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
        total:
          type: integer

    PaginationLinks:
      type: object
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
        next:
          $ref: '#/components/schemas/HalLink'
        previous:
          $ref: '#/components/schemas/HalLink'

    HalLink:
      type: object
      required:
        - href
      properties:
        href:
          type: string
        method:
          type: string
          enum: [ GET, POST, DELETE, PUT ]
        templated:
          type: boolean

    TenantIdAvailabilityDTO:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 21
        status:
          type: string
          description: FREE = assignable, RESERVED = held by an open invite,
            ASSIGNED = consumed by an existing tenant
          enum: [ FREE, RESERVED, ASSIGNED ]

    NextFreeTenantIdDTO:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 36

    TenantIdReservationRequestDTO:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
          minimum: 1
          description: Specific tenant ID to reserve. Omit for AUTO mode, which reserves
            the smallest currently free ID atomically.

    TenantIdReservationDTO:
      type: object
      required:
        - tenantId
        - token
      properties:
        tenantId:
          type: integer
          format: int64
          example: 21
        token:
          type: string
          maxLength: 36
          description: Reservation token. Required to consume the reserved ID when the
            tenant is created.
