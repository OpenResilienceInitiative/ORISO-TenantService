    # DPIA operator master data (ORISO-Admin#735). Platform-level singleton maintained by
    # the platform super admin; consumed publicly by the living-DPIA/legal document
    # renderers. Public consumers additionally get the resolved tenant branding
    # (PublicDpiaMasterDataDTO). Deliberately NO secrets and NO free-form maps here:
    # every field is typed so nothing secret can ride along unnoticed.
    PlatformDpiaMasterDataDTO:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/DpiaOperatorDTO'
        supervisoryAuthority:
          $ref: '#/components/schemas/DpiaSupervisoryAuthorityDTO'
        document:
          $ref: '#/components/schemas/DpiaDocumentMetadataDTO'
        keyFigures:
          $ref: '#/components/schemas/DpiaKeyFiguresDTO'

    DpiaOperatorDTO:
      type: object
      properties:
        legalName:
          type: string
          maxLength: 255
          example: "Deutscher Caritasverband e. V."
        shortName:
          type: string
          maxLength: 255
          example: "DCV"
        address:
          type: string
          maxLength: 512
          example: "Karlstrasse 40, 79104 Freiburg"
        contactEmail:
          type: string
          maxLength: 255
          example: "datenschutz@example.org"
        contactPhone:
          type: string
          maxLength: 64
          example: "+49 761 200-0"
        dpoName:
          type: string
          maxLength: 255
          description: 'Name or organisation of the data protection officer.'
        department:
          type: string
          maxLength: 255
          description: 'Department responsible for the processing activity.'
        responsiblePerson:
          type: string
          maxLength: 255
          description: 'Person responsible for the processing activity.'

    DpiaSupervisoryAuthorityDTO:
      type: object
      properties:
        legalFramework:
          type: string
          enum: [KDG, GDPR]
          description: >-
            Compliance preset the supervisory authority follows: KDG (diocesan data
            protection officer) or GDPR (state data protection authority). Switches
            all norm citations in the rendered documents.
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 512
        email:
          type: string
          maxLength: 255

    DpiaDocumentMetadataDTO:
      type: object
      properties:
        documentDate:
          type: string
          format: date
          description: 'Date of the current document version.'
        nextReviewDate:
          type: string
          format: date
          description: 'Date the document is due for its next review.'

    DpiaKeyFiguresDTO:
      type: object
      description: >-
        Manually maintained platform key figures (count + as-of date each).
        Automatic fill from platform statistics is a follow-up.
      properties:
        tenants:
          $ref: '#/components/schemas/DpiaKeyFigureDTO'
        counsellingCentres:
          $ref: '#/components/schemas/DpiaKeyFigureDTO'
        activeCounsellors:
          $ref: '#/components/schemas/DpiaKeyFigureDTO'
        registeredClients:
          $ref: '#/components/schemas/DpiaKeyFigureDTO'

    DpiaKeyFigureDTO:
      type: object
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
        asOfDate:
          type: string
          format: date

    PublicDpiaMasterDataDTO:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/DpiaOperatorDTO'
        supervisoryAuthority:
          $ref: '#/components/schemas/DpiaSupervisoryAuthorityDTO'
        document:
          $ref: '#/components/schemas/DpiaDocumentMetadataDTO'
        keyFigures:
          $ref: '#/components/schemas/DpiaKeyFiguresDTO'
        branding:
          $ref: '#/components/schemas/DpiaBrandingDTO'

    DpiaBrandingDTO:
      type: object
      description: >-
        Document branding source: reuses the existing public tenant appearance
        (logo upload + appearance tokens) of the resolved tenant context, with missing
        fields inherited from platform tenant 0. Uses platform tenant 0 directly when no
        tenant context can be resolved.
      properties:
        tenantName:
          type: string
        theming:
          $ref: '#/components/schemas/Theming'

    ChatRecoveryMode:
      type: string
      enum: [RECOVERY_KEY, LOGIN_PASSWORD]

    ChatRecoverySettings:
      type: object
      required: [asker, consultant, revision]
      properties:
        asker:
          $ref: '#/components/schemas/ChatRecoveryMode'
        consultant:
          $ref: '#/components/schemas/ChatRecoveryMode'
        revision:
          type: integer
          format: int64
          minimum: 0

    AccountInactivitySettings:
      type: object
      description: Platform creation defaults only. Existing people retain their assigned months.
      required: [askerMonths, consultantMonths, otherMonths, revision]
      properties:
        askerMonths:
          type: integer
          format: int32
          minimum: 1
        consultantMonths:
          type: integer
          format: int32
          minimum: 1
        otherMonths:
          type: integer
          format: int32
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 0

    TenantAdminControls:
      type: object
      properties:
        accountInactivitySettings:
          $ref: '#/components/schemas/AccountInactivitySettings'
        chatRecoverySettings:
          $ref: '#/components/schemas/ChatRecoverySettings'
        permissionsPageEnabled:
          type: boolean
          example: "true"
        allowedPermissionToggles:
          $ref: '#/components/schemas/TenantAdminAllowedPermissionToggles'
        # enforcedPermissionToggles: per-feature flags an upper role locks ON for every lower role
        # (Platform -> Traeger -> Beratungsstelle). true = enforced-on; absent/false = not enforced.
        # Same shape as allowedPermissionToggles; retained only for transition reads.
        enforcedPermissionToggles:
          $ref: '#/components/schemas/TenantAdminAllowedPermissionToggles'
        permissionPolicies:
          type: object
          description: >-
            Canonical per-feature policy map. Keys are PermissionFeatureKey values. This is the
            only write model for new clients; legacy allowed/enforced maps remain read-compatible
            for the transition release.
          additionalProperties:
            $ref: '#/components/schemas/BooleanPermissionPolicy'
        caseHandoverPolicies:
          $ref: '#/components/schemas/CaseHandoverPolicies'

    PermissionPolicyMode:
      type: string
      enum:
        - ENFORCED
        - SUGGESTED

    BooleanPermissionPolicy:
      type: object
      required:
        - value
        - mode
      properties:
        value:
          type: boolean
        mode:
          $ref: '#/components/schemas/PermissionPolicyMode'
        inherited:
          type: boolean
          readOnly: true
          description: True when the resolved tenant value comes from the platform policy.

    IntegerPermissionPolicy:
      type: object
      required: [value, mode]
      properties:
        value:
          type: integer
          minimum: 15
          multipleOf: 15
          description: Finite duration in 15-minute steps. There is intentionally no product maximum.
        mode:
          $ref: '#/components/schemas/PermissionPolicyMode'
        inherited:
          type: boolean
          readOnly: true

    StringListPermissionPolicy:
      type: object
      required: [value, mode]
      properties:
        value:
          type: array
          uniqueItems: true
          items:
            type: string
        mode:
          $ref: '#/components/schemas/PermissionPolicyMode'
        inherited:
          type: boolean
          readOnly: true

    MultilingualTextPermissionPolicy:
      type: object
      required: [value, mode]
      properties:
        value:
          type: object
          additionalProperties:
            type: string
        mode:
          $ref: '#/components/schemas/PermissionPolicyMode'
        inherited:
          type: boolean
          readOnly: true

    CaseHandoverConsentValue:
      type: string
      enum:
        - OPT_IN
        - OPT_OUT
        - NONE

    ConsentPermissionPolicy:
      type: object
      required: [value, mode]
      properties:
        value:
          $ref: '#/components/schemas/CaseHandoverConsentValue'
        mode:
          $ref: '#/components/schemas/PermissionPolicyMode'
        inherited:
          type: boolean
          readOnly: true

    CaseHandoverReasonPolicy:
      type: object
      required:
        - code
        - labels
        - enabled
        - accessAllowed
        - clientConsentRequired
        - approvalRoles
        - clientNotificationTemplates
      properties:
        code:
          type: string
          enum:
            - COUNSELLOR_ASKED_FOR_ADVICE
            - COUNSELLOR_ON_HOLIDAY
            - OTHER_EMERGENCY
            - COUNSELLOR_IS_ILL
            - COUNSELLOR_LEFT
        labels:
          $ref: '#/components/schemas/MultilingualTextPermissionPolicy'
        enabled:
          $ref: '#/components/schemas/BooleanPermissionPolicy'
        accessAllowed:
          $ref: '#/components/schemas/BooleanPermissionPolicy'
        clientConsent:
          $ref: '#/components/schemas/ConsentPermissionPolicy'
          description: Canonical typed consent policy. Optional while legacy clients migrate from clientConsentRequired.
        clientConsentRequired:
          $ref: '#/components/schemas/BooleanPermissionPolicy'
          deprecated: true
          description: Transitional mirror. OPT_IN maps to true; OPT_OUT and NONE map to false.
        approvalRoles:
          $ref: '#/components/schemas/StringListPermissionPolicy'
        clientNotificationTemplates:
          $ref: '#/components/schemas/MultilingualTextPermissionPolicy'
        maxAccessDurationMinutes:
          allOf:
            - $ref: '#/components/schemas/IntegerPermissionPolicy'
          description: Required only for COUNSELLOR_ASKED_FOR_ADVICE; absent for non-expiring takeover reasons.

    CaseHandoverPolicies:
      type: object
      required: [reasons]
      properties:
        reasons:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CaseHandoverReasonPolicy'

    PermissionFeatureKey:
      type: string
      enum:
        - appearance
        - featureAnonymousChatEnabled
        - featureGroupChatV2Enabled
        - featureInternalGroupChatEnabled
        - featureSelfHelpGroupsEnabled
        - featureCallsEnabled
        - featureSupervisionEnabled
        - featureSupervisionAnonymousChatsEnabled
        - featureSupervisionOneOnOneChatsEnabled
        - featureAudioCallsEnabled
        - featureAudioCallsAnonymousChatsEnabled
        - featureAudioCallsOneOnOneChatsEnabled
        - featureAudioCallsGroupChatsEnabled
        - featureAudioCallsSupervisionChatsEnabled
        - featureVideoCallsEnabled
        - featureVideoCallsAnonymousChatsEnabled
        - featureVideoCallsOneOnOneChatsEnabled
        - featureVideoCallsGroupChatsEnabled
        - featureVideoCallsSupervisionChatsEnabled
        - featureThreadsEnabled
        - featureThreadsAnonymousChatsEnabled
        - featureThreadsOneOnOneEnabled
        - featureThreadsGroupChatsEnabled
        - featureThreadsSupervisionChatsEnabled
        - featureVoiceMessagesEnabled
        - featureVoiceMessagesAnonymousChatsEnabled
        - featureVoiceMessagesOneOnOneChatsEnabled
        - featureVoiceMessagesGroupChatsEnabled
        - featureVoiceMessagesSupervisionChatsEnabled
        - featureMediaUploadEnabled
        - featureMediaUploadAnonymousChatsEnabled
        - featureMediaUploadOneOnOneChatsEnabled
        - featureMediaUploadGroupChatsEnabled
        - featureMediaUploadSupervisionChatsEnabled
        - featureMediaInlineDisplayEnabled
        - featureMediaInlineDisplayAnonymousChatsEnabled
        - featureMediaInlineDisplayOneOnOneChatsEnabled
        - featureMediaInlineDisplayGroupChatsEnabled
        - featureMediaInlineDisplaySupervisionChatsEnabled
        - featureMediaAiScanEnabled
        - featureMediaAiScanAnonymousChatsEnabled
        - featureMediaAiScanOneOnOneChatsEnabled
        - featureMediaAiScanGroupChatsEnabled
        - featureMediaAiScanSupervisionChatsEnabled
        - featureDisplayNameEditable
        - featureAskerEmailEnabled
        - caseHandoverEnabled

    TenantLegalDraftDTO:
      type: object
      required: [kind, content, revision, updatedAt]
      properties:
        kind:
          type: string
          enum: [PRIVACY, IMPRINT]
          readOnly: true
        content:
          type: object
          additionalProperties: {type: string}
        privacyConsent:
          type: object
          additionalProperties: {type: string}
          description: >-
            Optional privacy consent sentence map by language. Values are plain text. Supported
            only for PRIVACY drafts; omit for IMPRINT drafts.
        revision:
          type: string
          pattern: '^(new|[1-9][0-9]*:[0-9]+)$'
          description: Opaque concurrency token. Use new only when no draft exists.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        originProposalId: {type: integer, format: int64, readOnly: true}
        originDistributionId: {type: string, format: uuid, readOnly: true}
        originSourceRevision: {type: string, readOnly: true}
        originSourceUpdatedAt: {type: string, format: date-time, readOnly: true}
        originSharedBy: {type: string, readOnly: true}

    TenantLegalDraftUpdateRequest:
      type: object
      required: [content, revision]
      properties:
        content:
          type: object
          additionalProperties: {type: string}
        privacyConsent:
          type: object
          description: >-
            Optional privacy consent sentence map by language. Every value must be plain text.
            Supported only for PRIVACY drafts; omit for IMPRINT drafts.
        revision:
          type: string
          pattern: '^(new|[1-9][0-9]*:[0-9]+)$'
          description: Opaque concurrency token. Use new only when no draft exists.

    TenantLegalProposalDistributionRequest:
      type: object
      required: [requestKey, kind, sourceRevision, audience]
      properties:
        requestKey: {type: string, minLength: 1, maxLength: 128}
        kind: {type: string, enum: [PRIVACY, IMPRINT]}
        sourceRevision: {type: string, pattern: '^[1-9][0-9]*:[0-9]+$'}
        audience: {type: string, enum: [SELECTED, ALL]}
        tenantIds:
          type: array
          uniqueItems: true
          items: {type: integer, format: int64, minimum: 1}
    TenantLegalProposalDistributionDTO:
      type: object
      required: [requestKey, recipientTenantIds, proposals]
      properties:
        requestKey: {type: string}
        recipientTenantIds:
          type: array
          description: Immutable original audience, including recipients deleted after delivery.
          items: {type: integer, format: int64}
        proposals: {type: array, items: {$ref: '#/components/schemas/TenantLegalProposalDTO'}}
    TenantLegalTemplateVersionDTO:
      type: object
      required: [distributionId, sourceRevision, createdAt, recipientCount]
      properties:
        distributionId: {type: string, format: uuid}
        sourceRevision: {type: string, description: 'Platform draft revision (id:version) that was sent'}
        createdAt: {type: string, format: date-time, description: 'When it was sent (UTC)'}
        recipientCount: {type: integer, format: int32}
        content:
          type: object
          additionalProperties: {type: string}
          description: Snapshot that was sent; absent only if it can no longer be recovered.
        privacyConsent: {type: object, additionalProperties: {type: string}}
    TenantLegalProposalDTO:
      type: object
      required: [id, recipientTenantId, kind, content, status, revision, sourceRevision, sourceUpdatedAt, distributionId, createdBy, createdAt]
      properties:
        id: {type: integer, format: int64}
        recipientTenantId: {type: integer, format: int64}
        kind: {type: string, enum: [PRIVACY, IMPRINT]}
        content: {type: object, additionalProperties: {type: string}}
        privacyConsent: {type: object, additionalProperties: {type: string}}
        status: {type: string, enum: [PENDING, DISMISSED, SUPERSEDED, ADOPTED]}
        revision: {type: string}
        sourceRevision: {type: string}
        sourceUpdatedAt: {type: string, format: date-time}
        distributionId:
          type: string
          format: uuid
          description: Distribution that first created this immutable proposal snapshot.
        audience: {type: string, enum: [SELECTED, ALL]}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
        decidedBy: {type: string}
        decidedAt: {type: string, format: date-time}
        supersededByProposalId: {type: integer, format: int64}
        supersededAt: {type: string, format: date-time}
    TenantLegalProposalDismissRequest:
      type: object
      required: [expectedProposalRevision]
      properties:
        expectedProposalRevision: {type: string}
    TenantLegalProposalAdoptRequest:
      type: object
      required: [mode, expectedProposalRevision]
      properties:
        mode: {type: string, enum: [CREATE_IF_EMPTY, ARCHIVE_AND_REPLACE]}
        expectedProposalRevision: {type: string}
        expectedDraftRevision: {type: string}
    TenantLegalDraftArchiveDTO:
      type: object
      required: [id, tenantId, kind, draftRowId, draftRevision, content, draftSavedAt, archivedBy, archivedAt]
      properties:
        id: {type: integer, format: int64}
        tenantId: {type: integer, format: int64}
        kind: {type: string, enum: [PRIVACY, IMPRINT]}
        draftRowId: {type: integer, format: int64}
        draftRevision: {type: string}
        content: {type: object, additionalProperties: {type: string}}
        privacyConsent: {type: object, additionalProperties: {type: string}}
        draftSavedAt: {type: string, format: date-time}
        originProposalId: {type: integer, format: int64}
        originDistributionId: {type: string, format: uuid}
        originSourceRevision: {type: string}
        originSourceUpdatedAt: {type: string, format: date-time}
        originSharedBy: {type: string}
        archivedBy: {type: string}
        archivedAt: {type: string, format: date-time}

    TenantLegalTextVersionDTO:
      type: object
      description: >-
        One immutable published wording. Identity is the surrogate id, never publishedAt.
        Mirrors AgencyService LegalTextVersionDTO; ownerLevel adds the two TenantService levels.
      required: [id, kind, ownerLevel, ownerId, content, publishedAt]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [DPP, IMPRINT]}
        ownerLevel:
          type: string
          description: PLATFORM for tenant 0 (platform operator), TENANT for a Träger
          enum: [PLATFORM, TENANT]
        ownerId:
          type: integer
          format: int64
          description: The tenant id (0 = platform)
        content:
          type: string
          description: The wording as published, verbatim - a JSON language->HTML map string
        publishedAt:
          type: string
          description: Local date-time (UTC) in the fixed 19-character form yyyy-MM-ddTHH:mm:ss
          example: "2026-09-25T13:12:08"
        publishedBy:
          type: string
          description: Keycloak user id of the publisher; null when none was known, never guessed
        supersededAt:
          type: string
          description: When a newer publication (or a removal) replaced this one; null = still in force
          example: "2026-09-26T08:00:00"

