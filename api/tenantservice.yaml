        mediaInlineDisplayGroupChats:
          type: boolean
          example: "true"
        mediaInlineDisplaySupervisionChats:
          type: boolean
          example: "true"
        mediaAiScan:
          type: boolean
          example: "true"
        mediaAiScanAnonymousChats:
          type: boolean
          example: "true"
        mediaAiScanOneOnOneChats:
          type: boolean
          example: "true"
        mediaAiScanGroupChats:
          type: boolean
          example: "true"
        mediaAiScanSupervisionChats:
          type: boolean
          example: "true"

    TenantMediaResponseDTO:
      type: object
      properties:
        id:
          type: string
          example: "3f6f1c1e-8a7b-4c2d-9e0f-1a2b3c4d5e6f"
        url:
          type: string
          description: "Server-relative path the stored media is served from."
          example: "/media/3f6f1c1e-8a7b-4c2d-9e0f-1a2b3c4d5e6f"
        contentType:
          type: string
          example: "image/png"

    SmtpConfig:
      type: object
      properties:
        enabled:
          type: boolean
          example: "false"
        host:
          type: string
          example: "smtp.titan.email"
        port:
          type: integer
          example: 587
        secure:
          type: boolean
          example: "false"
        username:
          type: string
          example: "notifications@oriso.org"
        password:
          type: string
          description:
            "Write-only. Never returned in responses; a blank, absent or
            \"********\" value on update keeps the stored password."
          example: "********"
        passwordSet:
          type: boolean
          description:
            "Read-only. True if an SMTP password is stored for this tenant.
            Ignored on create/update."
          example: true
        from:
          type: string
          example: "notifications@oriso.org"
        emailThemeColor:
          type: string
          example: "#0f3b8f"

    MultilingualContent:
      type: object
      required:
        - impressum
      properties:
        impressum:
          type: object
          additionalProperties:
            type: string
        erstantwortGreeting:
          type: object
          additionalProperties:
            type: string
          description: >-
            ORISO-Admin#601 / ADR-018. Träger-authored Erstantwort Baustein as a `<lang>` → HTML
            map, the same shape the legal texts use, so machine translation on publish applies
            unchanged. Absent means the Träger authored nothing and the resolution chain falls
            through to the platform text — not the same as an empty string.
        erstantwortWhoReadsAlong:
          type: object
          additionalProperties:
            type: string
          description: >-
            Mandatory by decision: the Träger is the controller and ORISO the processor, so the
            platform must not derive a claim about who can read a counselling room.
        erstantwortEmergencyAddition:
          type: object
          additionalProperties:
            type: string
          description: >-
            Addition to the platform emergency numbers, never a replacement — those carry no
            toggle at all (ADR-018 §6).
        erstantwortFreeNotice:
          type: object
          additionalProperties:
            type: string
          description: >-
            The single "Freier Hinweis" (ADR-018 §2). Exactly one, enforced by the schema.
        erstantwortClosing:
          type: object
          additionalProperties:
            type: string
        erstantwortResponseDeadlineDays:
          type: integer
          example: 2
          minimum: 1
          maximum: 30
          description: >-
            The Antwortfrist in working days — a NUMBER, never prose (ADR-018). Absent means the
            platform default (2) applies, deliberately distinguishable from a Träger that chose 2.
        claim:
          type: object
          additionalProperties:
            type: string
        privacy:
          type: object
          additionalProperties:
            type: string
        confirmPrivacy:
          type: boolean
        termsAndConditions:
          type: object
          additionalProperties:
            type: string
        confirmTermsAndConditions:
          type: boolean
        dataProtectionContactTemplate:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DataProtectionContactTemplateDTO'

    DataProtectionContactTemplateDTO:
        type: object
        properties:
            agencyContext:
              $ref: '#/components/schemas/AgencyContextDTO'
            noAgencyContext:
              $ref: '#/components/schemas/NoAgencyContextDTO'

    AgencyContextDTO:
      type: object
      properties:
        responsibleContact:
          type: string
        dataProtectionOfficer:
          $ref: '#/components/schemas/DataProtectionOfficerDTO'

    NoAgencyContextDTO:
      type: object
      properties:
        responsibleContact:
          type: string
        dataProtectionOfficerContact:
          type: string

    DataProtectionOfficerDTO:
      type: object
      properties:
        agencyResponsibleContact:
          type: string
        alternativeRepresentativeContact:
          type: string
        dataProtectionOfficerContact:
          type: string


    AdminTenantDTO:
      type: object
      required:
        - id
        - name
        - subdomain
      properties:
        id:
          type: integer
          format: int64
          example: 12132
        name:
          type: string
          example: "Company name AG"
          maxLength: 40
        subdomain:
          type: string
          example: "companyname"
          maxLength: 100
        address:
          type: string
          maxLength: 255
          example: "Musterstraße 1, 12345 Musterstadt"
        description:
          type: string
          example: "Short description of the tenant."
        beraterCount:
          type: integer
          example: 10
        adminEmails:
          type: array
          items:
            type: string
          example: "[admin1@ob.de, admin2@ob.de]"
        createDate:
          type: string
        updateDate:
          type: string

    TenantsSearchResultDTO:
      type: object
      properties:
        _embedded:
          type: array
          items:
            $ref: '#/components/schemas/AdminTenantDTO'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
        total:
          type: integer

    PaginationLinks:
      type: object
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/HalLink'
        next:
          $ref: '#/components/schemas/HalLink'
        previous:
          $ref: '#/components/schemas/HalLink'

    HalLink:
      type: object
      required:
        - href
      properties:
        href:
          type: string
        method:
          type: string
          enum: [ GET, POST, DELETE, PUT ]
        templated:
          type: boolean

    TenantIdAvailabilityDTO:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
          example: 21
        status:
          type: string
          description: FREE = assignable, RESERVED = held by an open invite,
            ASSIGNED = consumed by an existing tenant
          enum: [ FREE, RESERVED, ASSIGNED ]

    NextFreeTenantIdDTO:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 36

    TenantIdReservationRequestDTO:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
          minimum: 1
          description: Specific tenant ID to reserve. Omit for AUTO mode, which reserves
            the smallest currently free ID atomically.

    TenantIdReservationDTO:
      type: object
      required:
        - tenantId
        - token
      properties:
        tenantId:
          type: integer
          format: int64
          example: 21
        token:
          type: string
          maxLength: 36
          description: Reservation token. Required to consume the reserved ID when the
            tenant is created.
