openapi: 3.0.1

info:
  title: Definition for Tenant API
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1

paths:
  /tenantadmin:
    post:
      tags:
        - tenant-controller
      summary: 'Creates a new tenant [Authorization: Role: tenant-admin]'
      operationId: createTenant
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/MultilingualTenantDTO'
      responses:
        200:
          description: OK - successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultilingualTenantDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        409:
          description: CONFLICT - the requested tenant ID is already assigned or reserved
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
        503:
          description: SERVICE UNAVAILABLE - AUTO tenant ID allocation exhausted its retry
            budget under contention; retry later
    get:
      tags:
        - tenant-controller
      summary: 'Get all tenants with admin data [Authorization: Role: tenant-admin]'
      operationId: getAllTenantsWithAdminData
      responses:
        200:
          description: OK - successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminTenantDTO'
        204:
          description: NO CONTENT - no content found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition

  /tenantadmin/search:
    get:
      tags:
        - tenant-controller
      summary: 'Get tenants matching the given query [Auth: tenant-admin]'
      operationId: searchTenants
      parameters:
        - name: query
          in: query
          description: URL-encoded infix to search for name or id.
            A non-encoded star symbol searches for all.
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number (first page = 1)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: perPage
          in: query
          description: Number of items returned per page
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: field
          in: query
          description: field to sort by
          schema:
            type: string
            enum: [ NAME, ID, SUBDOMAIN, BERATERCOUNT ]
            default: NAME
            pattern: '^(NAME|ID|SUBDOMAIN|BERATERCOUNT)$'
        - name: order
          in: query
          description: sort order
          schema:
            type: string
            enum: [ ASC, DESC ]
            default: ASC
            pattern: '^(ASC|DESC)$'
      responses:
        200:
          description: OK - successful operation
          content:
            'application/hal+json':
              schema:
                $ref: '#/components/schemas/TenantsSearchResultDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid role/authorization
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /tenantadmin/controls:
    get:
      tags:
        - tenant-controller
      summary: 'Gets platform-level tenant admin controls [Authorization: Super admin]'
      operationId: getTenantAdminControls
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminControls'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - only super admin can access platform controls
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
    put:
      tags:
        - tenant-controller
      summary: 'Updates platform-level tenant admin controls [Authorization: Super admin]'
      operationId: updateTenantAdminControls
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/TenantAdminControls'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminControls'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - only super admin can update platform controls
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition

  /tenantadmin/controls/chat-recovery:
    get:
      tags: [tenant-controller]
      summary: 'Gets recovery defaults for newly created accounts [Authorization: Super admin]'
      operationId: getChatRecoverySettings
      responses:
        200:
          description: Current role defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRecoverySettings'
        401:
          description: UNAUTHORIZED
        403:
          description: FORBIDDEN - platform administrator required
    put:
      tags: [tenant-controller]
      summary: 'Updates recovery defaults for newly created accounts [Authorization: Super admin]'
      operationId: updateChatRecoverySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRecoverySettings'
      responses:
        200:
          description: Confirmed role defaults with current revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRecoverySettings'
        400:
          description: BAD REQUEST - missing or invalid modes or revision
        401:
          description: UNAUTHORIZED
        403:
          description: FORBIDDEN - platform administrator required
        409:
          description: CONFLICT - reload current settings before saving

  /tenantadmin/controls/account-inactivity:
    get:
      tags: [tenant-controller]
      summary: 'Gets inactivity defaults for newly created accounts [Authorization: Super admin]'
      operationId: getAccountInactivitySettings
      responses:
        200:
          description: Current role defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInactivitySettings'
        401:
          description: UNAUTHORIZED
        403:
          description: FORBIDDEN - platform administrator required
    put:
      tags: [tenant-controller]
      summary: 'Updates inactivity defaults for newly created accounts [Authorization: Super admin]'
      operationId: updateAccountInactivitySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInactivitySettings'
      responses:
        200:
          description: Confirmed role defaults with current revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInactivitySettings'
        400:
          description: BAD REQUEST - missing or invalid months or revision
        401:
          description: UNAUTHORIZED
        403:
          description: FORBIDDEN - platform administrator required
        409:
          description: CONFLICT - reload current settings before saving

  /tenantadmin/{id}/legal-drafts/{kind}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, format: int64}
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [PRIVACY, IMPRINT]}
    get:
      tags: [tenant-controller]
      summary: Gets a tenant legal draft
      operationId: getTenantLegalDraft
      responses:
        200:
          description: Successful operation
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalDraftDTO'}}}
        400: {description: Invalid legal draft kind}
        404: {description: No saved draft or tenant}
        403: {description: Forbidden}
    put:
      tags: [tenant-controller]
      summary: Saves a tenant legal draft using its expected revision
      operationId: updateTenantLegalDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantLegalDraftUpdateRequest'}
      responses:
        200:
          description: Successful operation
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalDraftDTO'}}}
        400: {description: Invalid legal draft kind or request body}
        404: {description: Tenant not found}
        409: {description: Stale draft revision}
        403: {description: Forbidden}
    delete:
      tags: [tenant-controller]
      summary: Deletes a tenant legal draft using its expected revision
      operationId: deleteTenantLegalDraft
      parameters:
        - name: revision
          in: query
          required: true
          schema: {type: string, pattern: '^(new|[1-9][0-9]*:[0-9]+)$'}
      responses:
        204: {description: Deleted}
        400: {description: Invalid legal draft kind or revision}
        404: {description: No saved draft or tenant}
        409: {description: Stale draft revision}
        403: {description: Forbidden}
  /tenantadmin/legal-proposal-distributions:
    get:
      tags: [tenant-controller]
      summary: Lists the template versions the platform has sent for one legal document
      description: >-
        Platform administrator only. Newest first. Each entry is one distribution with the exact
        snapshot every recipient received, so the admin can look back at what went out and to how
        many Träger.
      operationId: getTenantLegalTemplateHistory
      parameters:
        - {name: kind, in: query, required: true, schema: {type: string, enum: [PRIVACY, IMPRINT]}}
      responses:
        200:
          description: Sent template versions, newest first
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TenantLegalTemplateVersionDTO'}}}}
        400: {description: Invalid kind}
        401: {description: Unauthorized}
        403: {description: Platform administrator required}
    post:
      tags: [tenant-controller]
      summary: Shares an immutable platform legal draft revision with a fixed tenant audience
      description: >-
        Platform administrator only. requestKey makes retries return the original fixed audience,
        including ALL deliveries after the platform draft or tenant set changes. This never
        publishes or changes a recipient draft.
      operationId: distributeTenantLegalProposal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantLegalProposalDistributionRequest'}
      responses:
        200:
          description: Existing idempotent distribution
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalProposalDistributionDTO'}}}
        201:
          description: Created distribution
          content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalProposalDistributionDTO'}}}
        400: {description: 'Invalid audience, recipients, kind, or request key'}
        401: {description: Unauthorized}
        403: {description: Platform administrator required}
        404: {description: Platform draft not found}
        409: {description: Source revision changed or request key reused with different input}
  /tenantadmin/{id}/legal-proposals:
    get:
      tags: [tenant-controller]
      summary: Lists incoming legal proposal history for a tenant
      description: Platform sender or exact recipient. Newest proposals sort first; SUPERSEDED entries remain readable history.
      operationId: getTenantLegalProposals
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [PRIVACY, IMPRINT]}}
      responses:
        200:
          description: Proposal history
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TenantLegalProposalDTO'}}}}
        400: {description: Invalid tenant or kind}
        401: {description: Unauthorized}
        403: {description: Neither platform sender nor exact recipient}
  /tenantadmin/{id}/legal-proposals/{proposalId}:
    get:
      tags: [tenant-controller]
      summary: Gets one incoming legal proposal snapshot
      operationId: getTenantLegalProposal
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: proposalId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        200: {description: Proposal snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalProposalDTO'}}}}
        401: {description: Unauthorized}
        403: {description: Neither platform sender nor exact recipient}
        404: {description: Proposal not found within tenant scope}
  /tenantadmin/{id}/legal-proposals/{proposalId}/dismiss:
    post:
      tags: [tenant-controller]
      summary: Acknowledges the proposal notice without preventing later adoption
      description: Exact recipient legal editor only. A newer version may later move this entry to SUPERSEDED history.
      operationId: dismissTenantLegalProposal
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: proposalId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalProposalDismissRequest'}}}
      responses:
        200: {description: Notice acknowledged, content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalProposalDTO'}}}}
        401: {description: Unauthorized}
        403: {description: Exact recipient legal editor required}
        404: {description: Proposal not found within tenant scope}
        409: {description: Stale or terminal proposal revision}
  /tenantadmin/{id}/legal-proposals/{proposalId}/adopt:
    post:
      tags: [tenant-controller]
      summary: Adopts an incoming proposal into the recipient's editable draft
      description: >-
        Exact recipient legal editor only. CREATE_IF_EMPTY cannot overwrite. ARCHIVE_AND_REPLACE
        requires both current proposal and draft revisions, archives the full old draft atomically,
        and never changes published legal text.
      operationId: adoptTenantLegalProposal
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: proposalId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalProposalAdoptRequest'}}}
      responses:
        200: {description: Adopted editable draft, content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalDraftDTO'}}}}
        400: {description: Invalid adoption mode or revision combination}
        401: {description: Unauthorized}
        403: {description: Exact recipient legal editor required}
        404: {description: Proposal not found within tenant scope}
        409: {description: 'Existing draft requires confirmation, stale revision, or terminal proposal'}
  /tenantadmin/{id}/legal-draft-archives:
    get:
      tags: [tenant-controller]
      summary: Lists immutable recipient draft history created by confirmed replacement
      operationId: getTenantLegalDraftArchives
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: kind, in: query, required: false, schema: {type: string, enum: [PRIVACY, IMPRINT]}}
      responses:
        200: {description: Draft archive history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TenantLegalDraftArchiveDTO'}}}}}
        401: {description: Unauthorized}
        403: {description: Neither platform sender nor exact recipient}
  /tenantadmin/{id}/legal-draft-archives/{archiveId}:
    get:
      tags: [tenant-controller]
      summary: Gets one immutable archived editable draft
      operationId: getTenantLegalDraftArchive
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: archiveId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        200: {description: Archived draft, content: {application/json: {schema: {$ref: '#/components/schemas/TenantLegalDraftArchiveDTO'}}}}
        401: {description: Unauthorized}
        403: {description: Neither platform sender nor exact recipient}
        404: {description: Archive not found within tenant scope}
  /tenantadmin/{id}/legal-versions:
    get:
      tags: [tenant-controller]
      summary: Publication history of the Träger's (id > 0) or the platform's (id 0) imprint or privacy policy
      description: >-
        Newest first, one entry per published wording (ORISO-Admin#270). A save of the tenant's
        imprint or privacy content is its publication, so every save that changes the stored
        wording adds an entry; a save that leaves it unchanged does not, and a draft save never
        does. Texts published before this history existed have no entry (no guessed dates).
        Same shape as AgencyService's LegalTextVersionDTO. Readable by the platform administrator
        and by admins whose token names this tenant.
      operationId: getTenantLegalTextVersions
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
        - {name: kind, in: query, required: true, schema: {type: string, enum: [DPP, IMPRINT]}}
      responses:
        200:
          description: Publication history, newest first (empty if never published since the history exists)
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/TenantLegalTextVersionDTO'}}}}
        400: {description: Invalid tenant id or kind}
        401: {description: Unauthorized}
        403: {description: Caller is neither the platform administrator nor an admin of this tenant}
  /tenantadmin/{id}/permission-policies:
    parameters:
      - name: id
        in: path
        required: true
        description: Tenant ID
        schema:
          type: integer
          format: int64
    get:
      tags:
        - tenant-controller
      summary: Gets the tenant-resolved permission policies
      operationId: getTenantPermissionPolicies
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPermissionPolicies'
        403:
          description: FORBIDDEN - tenant admins can access only their own tenant
    put:
      tags:
        - tenant-controller
      summary: Updates tenant-scoped permission policy overrides
      operationId: updateTenantPermissionPolicies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantPermissionPolicies'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPermissionPolicies'
        403:
          description: FORBIDDEN - tenant admins can update only their own tenant
  /tenantadmin/dpia:
    get:
      tags:
        - tenant-controller
      summary: 'Gets platform-level DPIA operator master data [Authorization: Super admin]'
      operationId: getPlatformDpiaMasterData
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDpiaMasterDataDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - only super admin can access platform DPIA master data
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
    put:
      tags:
        - tenant-controller
      summary: 'Updates platform-level DPIA operator master data [Authorization: Super admin]'
      operationId: updatePlatformDpiaMasterData
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/PlatformDpiaMasterDataDTO'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformDpiaMasterDataDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - only super admin can update platform DPIA master data
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/translation/keys:
    get:
      tags:
        - tenant-controller
      summary: 'Gets the configured machine-translation provider API keys, masked [Authorization: Super admin]'
      description: 'Returns the platform-global translation provider API keys. Keys are always
        returned MASKED (first characters plus the last 4, e.g. "sk-…abcd") and can never be read
        back in full. A provider without a configured key is returned as null.'
      operationId: getTranslationApiKeys
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationApiKeysDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - only super admin can access translation provider keys
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/translation/keys/{provider}:
    put:
      tags:
        - tenant-controller
      summary: 'Sets the machine-translation API key for a provider [Authorization: Super admin]'
      description: 'Stores the API key for the given provider ("openrouter" or "mistral") in the
        platform-global admin controls. Returns all keys masked.'
      operationId: setTranslationApiKey
      parameters:
        - name: provider
          in: path
          description: Translation provider id, one of "openrouter" or "mistral"
            (validated server-side, unknown providers are rejected with 400)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationApiKeyUpdateDTO'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationApiKeysDTO'
        400:
          description: BAD REQUEST - unknown provider or invalid/empty key
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - only super admin can update translation provider keys
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/translate:
    post:
      tags:
        - tenant-controller
      summary: 'Machine-translates HTML texts into one or more target languages [Authorization: Authority.UPDATE_TENANT]'
      description: 'Translates the given HTML texts (fieldKey -> HTML) from sourceLang into every
        requested target language using an LLM provider (OpenRouter or Mistral) with the
        platform-global API keys. HTML tags, attributes and structure are preserved; only
        human-readable text is translated. If no provider is requested explicitly, openrouter is
        used when its key is configured, otherwise mistral. Typed error codes:
        TRANSLATION_NOT_CONFIGURED (409, no API key configured), TRANSLATION_KEY_INVALID (502,
        provider rejected the key), TRANSLATION_NO_CREDIT (502, provider credit exhausted),
        TRANSLATION_RATE_LIMITED (502, provider rate limit hit),
        TRANSLATION_PROVIDER_UNAVAILABLE (502, provider timeout or 5xx). The response is meant to
        be published together with the machine-translation metadata convention: for every machine
        translated language the client stores a parallel "<lang>__meta" key with the strict JSON
        value {"mt":true,"src":"<sourceLang>","at":"<ISO-timestamp>"} next to the translated HTML
        in the same language->HTML map.'
      operationId: translate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationRequestDTO'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or unknown provider
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        409:
          description: CONFLICT - no translation provider API key configured (TRANSLATION_NOT_CONFIGURED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorDTO'
        502:
          description: BAD GATEWAY - translation provider error (TRANSLATION_KEY_INVALID,
            TRANSLATION_NO_CREDIT, TRANSLATION_RATE_LIMITED, TRANSLATION_PROVIDER_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorDTO'
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/translate/group-chat-author-content:
    post:
      tags:
        - tenant-controller
      summary: 'Translates bounded self-help group welcome and rule content [Authorization: consultant, group-chat-consultant]'
      description: 'Uses the configured translation provider for short, plain-text welcome and
        group-rule content. The endpoint is intentionally separate from tenant administration so
        consultants never receive tenant-management privileges.'
      operationId: translateGroupChatAuthorContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationRequestDTO'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResponseDTO'
        400:
          description: BAD REQUEST - content is missing or exceeds the group-chat limits
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - dedicated group-chat translation authority is missing
        409:
          description: CONFLICT - no translation provider API key configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorDTO'
        502:
          description: BAD GATEWAY - translation provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationErrorDTO'
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}:
    put:
      tags:
        - tenant-controller
      summary: 'Updates a tenant [Authorization: Role: tenant-admin or single-tenant-admin]'
      operationId: updateTenant
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/MultilingualTenantDTO'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultilingualTenantDTO'
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        409:
          description: CONFLICT - unique constraint validation fails
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
    get:
      tags:
        - tenant-controller
      summary: 'Gets a tenant by its id [Authorization: Role: tenant-admin or single-tenant-admin]'
      operationId: getMultilingualTenantById
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultilingualTenantDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        404:
          description: Not found
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/tenant-ids/{id}/availability:
    get:
      tags:
        - tenant-controller
      summary: 'Returns the allocation status of a single tenant ID [Authorization: platform admin]'
      operationId: getTenantIdAvailability
      parameters:
        - name: id
          in: path
          description: Tenant ID to check
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        200:
          description: OK - successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdAvailabilityDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no platform admin authority
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /tenantadmin/tenant-ids/next-free:
    get:
      tags:
        - tenant-controller
      summary: 'Returns the next free tenant ID from a value in a direction, skipping assigned
        and reserved IDs [Authorization: platform admin]'
      operationId: getNextFreeTenantId
      parameters:
        - name: from
          in: query
          description: Value to navigate from (exclusive)
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: direction
          in: query
          description: Navigation direction
          required: true
          schema:
            type: string
            enum: [ UP, DOWN ]
      responses:
        200:
          description: OK - successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextFreeTenantIdDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no platform admin authority
        404:
          description: NOT FOUND - no free tenant ID exists in the given direction
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /tenantadmin/tenant-ids/reservations:
    post:
      tags:
        - tenant-controller
      summary: 'Reserves a tenant ID for an open invite. Without a tenantId in the body (AUTO
        mode) the smallest currently free ID is reserved atomically [Authorization: platform admin]'
      operationId: reserveTenantId
      requestBody:
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/TenantIdReservationRequestDTO'
      responses:
        201:
          description: CREATED - the ID was reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantIdReservationDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no platform admin authority
        409:
          description: CONFLICT - the requested ID is already assigned or reserved
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
        503:
          description: SERVICE UNAVAILABLE - AUTO reservation exhausted its retry budget
            under contention; retry later
      security:
        - Bearer: [ ]
  /tenantadmin/tenant-ids/reservations/{id}:
    delete:
      tags:
        - tenant-controller
      summary: 'Releases an unconsumed tenant ID reservation so the ID becomes assignable
        again [Authorization: platform admin]'
      operationId: releaseTenantIdReservation
      parameters:
        - name: id
          in: path
          description: Reserved tenant ID to release
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        204:
          description: NO CONTENT - reservation released
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        403:
          description: FORBIDDEN - no platform admin authority
        404:
          description: NOT FOUND - no open reservation exists for this ID
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
      security:
        - Bearer: [ ]
  /tenant:
    get:
      tags:
        - tenant-controller
      summary: 'Get all tenants'
      operationId: getAllTenants
      responses:
        200:
          description: OK - successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BasicTenantLicensingDTO'
        204:
          description: NO CONTENT - no content found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/{id}:
    summary: Represents a tenant
    description: This resource represents an individual tenant in a system.
    get:
      tags:
        - tenant-controller
      summary: 'Gets a tenant by its id [Authorization: Role: tenant-admin or single-tenant-admin]'
      operationId: getTenantById
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        404:
          description: Not found
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/{subdomain}:
    summary: 'Represents a publicly allowed tenant data'
    description: This resource represents an individual tenant in a system.
    get:
      tags:
        - tenant-controller
      summary: 'Gets a tenant public information [Authorization: no-auth]'
      operationId: getRestrictedTenantDataBySubdomain
      parameters:
        - name: subdomain
          in: path
          description: Subdomain
          required: true
          schema:
            type: string
        - name: tenantId
          in: query
          description: Tenant Id
          required: false
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictedTenantDTO'
        404:
          description: Not found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/id/{tenantId}:
    summary: 'Represents a publicly allowed tenant data'
    description: This resource represents an individual tenant in a system.
    get:
      tags:
        - tenant-controller
      summary: 'Gets a tenant public information [Authorization: no-auth]'
      operationId: getRestrictedTenantDataByTenantId
      parameters:
        - name: tenantId
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictedTenantDTO'
        404:
          description: Not found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/ids:
    summary: 'Represents publicly allowed tenant data for a bounded set of ids'
    description: Existing tenants are returned; unknown ids are omitted and duplicate ids are normalized.
    post:
      tags:
        - tenant-controller
      summary: 'Gets public tenant information in one bounded batch [Authorization: no-auth]'
      operationId: getRestrictedTenantDataByTenantIds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: integer
                format: int64
      responses:
        200:
          description: Existing requested tenants; unknown ids are omitted
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/RestrictedTenantDTO'
        400:
          description: BAD REQUEST - request must contain 1 to 100 tenant ids
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/single:
    summary: 'Represents a publicly allowed tenant data'
    description: This resource represents the tenant in a single-tenant system.
    get:
      tags:
        - tenant-controller
      summary: 'Gets a tenant public information [Authorization: no-auth]'
      operationId: getRestrictedSingleTenancyTenantData
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictedTenantDTO'
        404:
          description: Not found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/:
    summary: 'Represents a publicly allowed tenant data. Tenant is resolved based on the request context.
     For single domain multitenancy it overerrides some of the attributes from main tenant and the current tenant like privacy or some tenant settings'
    description: This resource represents the tenant.
    get:
      tags:
        - tenant-controller
      summary: 'Gets a tenant public information [Authorization: no-auth]'
      operationId: getRestrictedTenantData
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictedTenantDTO'
        404:
          description: Not found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/access:
    summary: 'Validate if user can access tenant'
    description: This resource represents the access status for the given user to current tenant.
    get:
      tags:
        - tenant-controller
      summary: 'Validate if user can access tenant [Authorization: no-auth]'
      operationId: canAccessTenant
      responses:
        204:
          description: Successful operation
        401:
          description: UNAUTHORIZED - no/invalid permission for current tenant
        404:
          description: Not found
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/dpia:
    summary: 'Public DPIA operator master data and document branding source'
    description: >-
      Read-only, unauthenticated master data for the living DPIA / legal document renderers.
      Exposes ONLY the platform operator master data plus the existing public branding
      (logo/appearance) of the resolved tenant context — never secrets, SMTP configuration
      or tokens.
    get:
      tags:
        - tenant-controller
      summary: 'Gets public DPIA operator master data [Authorization: no-auth]'
      operationId: getPublicDpiaMasterData
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDpiaMasterDataDTO'
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/branding/{asset}:
    summary: 'Public effective tenant branding asset'
    description: >-
      Serves an uploaded effective logo or favicon as a normal HTTP image. Missing tenant
      values inherit from platform tenant 0. This allows mail clients and document renderers,
      which cannot use data URIs, to display the same branding as the application.
    get:
      tags:
        - tenant-controller
      summary: 'Gets an effective branding image [Authorization: no-auth]'
      operationId: getPublicBrandingAsset
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [logo, favicon]
      responses:
        200:
          description: Effective branding image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/x-icon:
              schema:
                type: string
                format: binary
        404:
          description: No valid image configured
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/branding/{tenantId}/{asset}:
    get:
      tags:
        - tenant-controller
      summary: 'Gets a tenant branding image without cookies [Authorization: no-auth]'
      description: >-
        Returns only stored effective logo or favicon bytes for the specified tenant,
        including inherited platform branding. The URL identifies the tenant so mail
        clients and image proxies cannot accidentally resolve another tenant's image.
        Unknown tenants or unsupported assets return 404; no external image is fetched.
      operationId: getPublicTenantBrandingAsset
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: asset
          in: path
          required: true
          schema:
            type: string
            enum: [logo, favicon]
      responses:
        200:
          description: Effective tenant branding image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/x-icon:
              schema:
                type: string
                format: binary
        404:
          description: Tenant or valid branding image not found
  /tenant/public/dpa/confirm/{token}:
    summary: 'Public confirmation (signature) of a tenant Data Processing Agreement'
    get:
      tags:
        - tenant-controller
      summary: 'Shows the exact published DPA bound to a valid sign token [Authorization: no-auth]'
      operationId: getDataProcessingAgreementPreview
      parameters:
        - name: token
          in: path
          description: Single-use sign token from the invite link
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaSignPreviewDTO'
        410:
          description: GONE - token unknown, already used, expired, or its contract version is missing
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
    post:
      tags:
        - tenant-controller
      summary: 'Confirms a tenant DPA via a single-use sign token [Authorization: no-auth]'
      operationId: confirmDataProcessingAgreement
      parameters:
        - name: token
          in: path
          description: Single-use sign token from the invite link
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DpaSignatureRequestDTO'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaSignatureDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        410:
          description: GONE - token unknown, already used, or expired
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenant/public/dpa/forward:
    summary: 'Create a DPA sign link from the public tenant onboarding context'
    description: 'Forward path for the tenant onboarding wizard (ORISO-TenantService#179): an
      administrator who is not authorised to sign can create a single-use sign link BEFORE the
      registration completes. The call is authorised by the onboarding context itself - the
      tenant-ID reservation pair (reserved tenant id + reservation token) issued for the invite -
      instead of a user session. The resulting PENDING signature is bound to the reserved tenant
      id, so the signature lands on the tenant once it exists; the link works immediately, before
      and after the registration finishes. The signed version is the operator DPA governing a
      tenant without an own published DPA.'
    post:
      tags:
        - tenant-controller
      summary: 'Creates a single-use DPA sign link for a reserved tenant [Authorization: no-auth,
        tenant-ID reservation token]'
      operationId: createPublicDpaForwardInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicDpaForwardRequestDTO'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaSignInviteDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        409:
          description: CONFLICT - no data processing agreement is published to sign yet
        410:
          description: GONE - unknown reservation, reservation token mismatch, a reservation
            already consumed by registration, or a released one; no information about the
            reservation state is leaked
        429:
          description: TOO MANY REQUESTS - too many unexpired sign links are already outstanding
            for this onboarding; existing links stay valid, so wait for one to be used or expire
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}/dpa/signatures:
    summary: 'Confirmed DPA signatures of a tenant (audit list)'
    get:
      tags:
        - tenant-controller
      summary: 'Lists the DPA confirmations of a tenant [Authorization: Authority.GET_TENANT]'
      operationId: getDataProcessingAgreementSignatures
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DpaSignatureDTO'
        403:
          description: FORBIDDEN - not authorized to access this tenant
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}/dpa/gate:
    summary: 'DPA legal-gate status of a tenant'
    description: 'Boolean projection of the authoritative DPA status (/dpa/status): dpaPublished
      means a DPA is in force for the tenant (its own or the governing operator DPA), dpaSigned
      means that exact version is signed - by an authenticated tenant admin in-app or by the
      authorised signer through a forwarded invite.'
    get:
      tags:
        - tenant-controller
      summary: 'Whether a DPA is in force for the tenant and signed [Authorization: Authority.GET_TENANT]'
      operationId: getDataProcessingAgreementGate
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaGateStatusDTO'
        403:
          description: FORBIDDEN - not authorized to access this tenant
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}/dpa/invite:
    summary: 'Create a single-use DPA sign invite (link) for a tenant'
    description: 'Forwarding path of the SAME single agreement: the natural person authorised to
      sign for the tenant organisation need not be an app user. The invite covers the DPA version
      in force for the tenant - its own published DPA, or the governing operator DPA - and the
      resulting signature always belongs to this tenant.'
    post:
      tags:
        - tenant-controller
      summary: 'Creates a single-use sign link for a tenant DPA [Authorization: Authority.UPDATE_TENANT]'
      operationId: createDataProcessingAgreementSignInvite
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaSignInviteDTO'
        403:
          description: FORBIDDEN - not authorized to access this tenant
        409:
          description: CONFLICT - the tenant has no published DPA to sign yet
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}/dpa:
    summary: 'Publish a tenant Data Processing Agreement (multilingual)'
    put:
      tags:
        - tenant-controller
      summary: 'Publishes the tenant DPA text and stamps a new version [Authorization: Authority.UPDATE_TENANT]'
      operationId: publishDataProcessingAgreement
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        description: 'Per-language DPA HTML content (language code -> HTML). Supports the
          machine-translation metadata convention: next to a translated language (e.g. "en") the
          map may carry a parallel "en__meta" key whose value is the strict JSON string
          {"mt":true,"src":"de","at":"<ISO-timestamp>"} marking the language as machine
          translated. Meta values are validated as strict JSON with only these fields and stored
          unsanitized; all other values are HTML-sanitized. When the HTML of a language is changed
          manually (i.e. the content changed but the resent meta is the previously stored one),
          the meta key for that language is removed - a manual edit clears the
          machine-translated tag.'
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaGateStatusDTO'
        403:
          description: FORBIDDEN - not authorized to access this tenant
        404:
          description: NOT FOUND - tenant does not exist
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}/dpa/versions:
    summary: 'Published versions of the DPA in force for a tenant (newest first)'
    description: 'The tenant''s own publish history if it authored a DPA, otherwise the governing
      operator DPA (tenant app.dpa.operator-tenant-id) it is measured against - the same document
      the DPA status and the in-app signing path use, so a tenant always has the agreement it is
      blocked on available to read. The content is the unchanged multilingual map; the caller
      picks the language.'
    get:
      tags:
        - tenant-controller
      summary: 'Lists the published versions of the DPA in force for a tenant
        [Authorization: Authority.GET_TENANT]'
      operationId: getDataProcessingAgreementVersions
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DpaVersionDTO'
        403:
          description: FORBIDDEN - not authorized to access this tenant
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}/dpa/status:
    summary: 'Authoritative DPA status of a tenant for its authenticated tenant admins'
    get:
      tags:
        - tenant-controller
      summary: 'Returns the authoritative DPA state (MISSING, UNSIGNED, OUTDATED, VALID,
        INCONSISTENT) of a tenant [Authorization: Authority.GET_TENANT]'
      operationId: getDataProcessingAgreementStatus
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaStatusDTO'
        403:
          description: FORBIDDEN - not authorized to access this tenant
        404:
          description: NOT FOUND - no tenant with the given id exists
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/{id}/dpa/sign:
    summary: 'Sign the currently published DPA version as an authenticated tenant admin'
    post:
      tags:
        - tenant-controller
      summary: 'Signs the current DPA version; persists signer identity, version, timestamp and
        form data append-only. Idempotent for an already-VALID tenant.
        [Authorization: Authority.UPDATE_TENANT]'
      operationId: signDataProcessingAgreement
      parameters:
        - name: id
          in: path
          description: Tenant ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DpaAdminSignRequestDTO'
      responses:
        200:
          description: Successful operation - returns the resulting authoritative DPA status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DpaStatusDTO'
        400:
          description: BAD REQUEST - the agreement checkbox was not accepted
        403:
          description: FORBIDDEN - not authorized to access this tenant
        409:
          description: CONFLICT - the tenant has no published DPA to sign yet
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /tenantadmin/media:
    post:
      tags:
        - tenant-controller
      summary:
        'Uploads an editor image owned by the calling admin''s tenant. Content type is derived
        from magic bytes (PNG/JPEG/WebP only, max 2 MB) [Authorization: tenant-admin,
        single-tenant-admin]'
      operationId: uploadTenantMedia
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        201:
          description: CREATED - media stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMediaResponseDTO'
        400:
          description: BAD REQUEST - unsupported content or size limit exceeded
        401:
          description: UNAUTHORIZED - no/invalid Keycloak token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /media/{mediaId}:
    get:
      tags:
        - tenant-controller
      summary:
        'Serves a stored tenant media file. Public: legal-text images are read by anonymous
        visitors. Immutable content (UUID ids), aggressively cacheable.'
      operationId: getTenantMedia
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK - media content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: NOT FOUND - unknown media id
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
components:
  schemas:
    TranslationApiKeysDTO:
      type: object
      description: 'Masked machine-translation provider API keys. A key is shown as its first
        characters plus the last 4 (e.g. "sk-…abcd"); null means no key is configured for that
        provider.'
      properties:
        openrouter:
          type: string
          example: "sk-…abcd"
        mistral:
          type: string
          example: "Fgh…9xyz"
    TranslationApiKeyUpdateDTO:
      type: object
      required:
        - apiKey
      properties:
        apiKey:
          type: string
          minLength: 1
          maxLength: 500
          example: "sk-or-v1-0123456789abcdef"
    TranslationRequestDTO:
      type: object
      required:
        - sourceLang
        - targetLangs
        - texts
      properties:
        sourceLang:
          type: string
          maxLength: 10
          example: "de"
        targetLangs:
          type: array
          items:
            type: string
            maxLength: 10
          minItems: 1
          example: [ "en", "fr" ]
        provider:
          type: string
          description: 'Optional explicit provider (openrouter or mistral). If omitted, openrouter
            is used when its key is configured, otherwise mistral.'
          example: "openrouter"
        texts:
          type: object
          description: 'HTML texts to translate, keyed by a caller-defined field key
            (e.g. "privacy", "impressum").'
          additionalProperties:
            type: string
    TranslationResponseDTO:
      type: object
      description: 'Translations keyed by target language, each holding the translated HTML per
        field key. HTML tags, attributes and structure are preserved by the provider prompt.'
      properties:
        translations:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        provider:
          type: string
          example: "openrouter"
        model:
          type: string
          example: "openai/gpt-4o-mini"
    TranslationErrorDTO:
      type: object
      description: 'Typed machine-translation error. errorCode is one of
        TRANSLATION_NOT_CONFIGURED, TRANSLATION_KEY_INVALID, TRANSLATION_NO_CREDIT,
        TRANSLATION_RATE_LIMITED, TRANSLATION_PROVIDER_UNAVAILABLE.'
      properties:
        errorCode:
          type: string
          example: "TRANSLATION_KEY_INVALID"
        provider:
          type: string
          example: "openrouter"
        message:
          type: string
    DpaVersionDTO:
      type: object
      properties:
        activationDate:
          type: string
        content:
          type: string
    DpaSignInviteDTO:
      type: object
      properties:
        token:
          type: string
        signLink:
          type: string
        expiresAt:
          type: string
    PublicDpaForwardRequestDTO:
      type: object
      required:
        - reservedTenantId
        - tenantIdReservationToken
      description: 'Onboarding-context credential for the public DPA forward: the reservation
        pair the tenant-admin onboarding invite carries (TenantIdReservationDTO). The raw
        reservation token is validated against the authoritative tenant-ID ledger and never
        persisted or logged by this endpoint.'
      properties:
        reservedTenantId:
          type: integer
          format: int64
          example: 42
        tenantIdReservationToken:
          type: string
          maxLength: 36
          example: "a81bc81b-dead-4e5d-abff-90865d1e13b1"
    DpaSignPreviewDTO:
      type: object
      required:
        - tenantName
        - dpaVersion
        - content
        - expiresAt
      properties:
        tenantName:
          type: string
          description: 'Name of the tenant the signature belongs to. A sign link created from
            the public onboarding context is bound to a reserved tenant id whose tenant row does
            not exist yet; until the registration completes this carries the same neutral
            placeholder the forward e-mail uses. Never null - the field stays required.'
        dpaVersion:
          type: string
        content:
          type: string
          description: 'Sanitized multilingual DPA snapshot as JSON (language code -> HTML).'
        expiresAt:
          type: string
    DpaGateStatusDTO:
      type: object
      properties:
        dpaPublished:
          type: boolean
        dpaSigned:
          type: boolean
        dpaForwardPending:
          type: boolean
          description: 'True while the governing DPA version is not signed but at least one
            unexpired sign link is outstanding for the tenant - the contract is "on hold"
            awaiting the authorised signer (status PENDING_FORWARDED).'
    DpaStatusDTO:
      type: object
      required:
        - tenantId
        - status
      properties:
        tenantId:
          type: integer
          format: int64
          example: 7
        status:
          type: string
          description: MISSING = no DPA ever published and nothing signed, UNSIGNED = published
            but never signed, OUTDATED = only an older version is signed, VALID = the current
            version is signed, INCONSISTENT = stored signature data contradicts the publish
            history. The "forwarded, awaiting signature" case is NOT a status value - it is the
            orthogonal forwardPending flag below, so existing consumers keep receiving the
            values they already handle.
          enum: [ MISSING, UNSIGNED, OUTDATED, VALID, INCONSISTENT ]
        forwardPending:
          type: boolean
          description: 'True while the tenant is not validly signed AND at least one unexpired
            sign link is outstanding - the contract is "on hold" awaiting the authorised signer.
            Never true for VALID, MISSING or INCONSISTENT.'
          example: false
        currentDpaVersion:
          type: string
          description: Activation timestamp of the currently published DPA version, if any
          example: "2026-07-01T12:00:00"
        signedDpaVersion:
          type: string
          description: Newest DPA version a signature exists for, if any
          example: "2026-05-01T10:00:00"
        signedAt:
          type: string
          description: Timestamp of the signature covering the newest signed version
          example: "2026-05-02T09:30:00"
        signedBy:
          type: string
          description: Display name of the signer of the newest signed version
          example: "Toni Tenantadmin"
    DpaAdminSignRequestDTO:
      type: object
      required:
        - signerName
        - accepted
      properties:
        signerName:
          type: string
          maxLength: 255
          example: "Toni Tenantadmin"
        signerPosition:
          type: string
          maxLength: 255
          example: "Geschäftsführung"
        signerEmail:
          type: string
          maxLength: 255
          format: email
          example: "toni@example.org"
        signerOrganisation:
          type: string
          maxLength: 255
          example: "Träger Nord e.V."
        accepted:
          type: boolean
          description: Must be true - the signer explicitly accepted the current DPA version
          example: true
        language:
          type: string
          maxLength: 10
          example: "de"
    DpaSignatureRequestDTO:
      type: object
      required:
        - signerName
        - signerPosition
        - signerEmail
        - signerOrganisation
        - language
        - accepted
      properties:
        signerName:
          type: string
          maxLength: 255
          example: "Erika Mustermann"
        signerPosition:
          type: string
          maxLength: 255
          example: "Geschäftsführerin"
        signerEmail:
          type: string
          maxLength: 255
          format: email
          example: "erika.mustermann@example.org"
        signerOrganisation:
          type: string
          maxLength: 255
          example: "Caritas Beispiel e.V."
        forwardedByUserId:
          type: string
          maxLength: 64
          example: "tenant-admin-1"
          deprecated: true
          description: 'Ignored since ORISO-TenantService#179: the forwarder identity is stamped
            server-side when the sign link is created and can no longer be supplied by the
            signing client.'
        source:
          type: string
          maxLength: 64
          example: "FORWARDED_EXTERNAL"
          deprecated: true
          description: 'Ignored since ORISO-TenantService#179: the signature source is stamped
            server-side when the sign link is created and can no longer be supplied by the
            signing client.'
        signerIsMember:
          type: boolean
          example: false
        accepted:
          type: boolean
          example: true
        language:
          type: string
          maxLength: 10
          example: "de"
    DpaSignatureDTO:
      type: object
      properties:
        tenantId:
          type: integer
          format: int64
        status:
          type: string
          example: "SIGNED"
        dpaVersion:
          type: string
          description: Activation timestamp identifying the signed DPA version
          example: "2026-07-01T12:00:00"
        signerName:
          type: string
        signerPosition:
          type: string
        signerEmail:
          type: string
        signerOrganisation:
          type: string
        forwardedByUserId:
          type: string
        source:
          type: string
        signedAt:
          type: string
    TenantDTO:
      type: object
      required:
        - id
        - name
        - subdomain
      properties:
        id:
          type: integer
          format: int64
          example: 12132
        name:
          type: string
          example: "Company name AG"
          maxLength: 40
        subdomain:
          type: string
          example: "companyname"
          maxLength: 100
        address:
          type: string
          maxLength: 255
          example: "Musterstraße 1, 12345 Musterstadt"
        description:
          type: string
          example: "Short description of the tenant."
        legalName:
          type: string
          maxLength: 255
          description: >-
            Full legal name of the Träger, e.g. "Caritasverband für die Erzdiözese Musterstadt e.V.".
            Optional; `name` stays the short display name (max 40). Mail footers name this as the
            sender where it is set. Same limit as the platform operator's `DpiaOperatorDTO.legalName`.
          example: "Caritasverband für die Erzdiözese Musterstadt e.V."
        contactEmail:
          type: string
          format: email
          maxLength: 255
          description: >-
            Contact e-mail address of the Träger, shown in the mail footer's contact line. Optional.
          example: "beratung@caritas-musterstadt.de"
        contactPhone:
          type: string
          maxLength: 64
          description: Contact phone number of the Träger, shown in the mail footer. Optional.
          example: "+49 761 200-0"
        createDate:
          type: string
        updateDate:
          type: string
        licensing:
          $ref: '#/components/schemas/Licensing'
        theming:
          $ref:
            '#/components/schemas/Theming'
        content:
          $ref:
            '#/components/schemas/Content'
        settings:
          $ref:
            '#/components/schemas/Settings'
    MultilingualTenantDTO:
          type: object
          required:
            - name
          properties:
            id:
              type: integer
              format: int64
              example: 12132
            name:
              type: string
              example: "Company name AG"
              maxLength: 40
            subdomain:
              type: string
              description: >-
                Multitenancy routing key. Must match `^[a-z0-9]([a-z0-9-]*[a-z0-9])?$`: lowercase
                letters, digits and hyphens, starting and ending alphanumeric. Enforced by the
                service on create, and on update whenever the submitted value differs from the
                stored one - rows written before the rule existed stay editable. A violation is
                answered with 400 and `X-Reason: SUBDOMAIN_INVALID`.

                Deliberately not expressed as `pattern`: that would apply the rule to every
                update of an already-stored value as well, locking admins out of records that
                predate it.
              example: "companyname"
              maxLength: 100
            address:
              type: string
              maxLength: 255
              example: "Musterstraße 1, 12345 Musterstadt"
            description:
              type: string
              example: "Short description of the tenant."
            legalName:
              type: string
              maxLength: 255
              description: >-
                Full legal name of the Träger, e.g. "Caritasverband für die Erzdiözese Musterstadt e.V.".
                Optional; `name` stays the short display name (max 40). Mail footers name this as the
                sender where it is set. Same limit as the platform operator's `DpiaOperatorDTO.legalName`.
                On update, an absent value keeps the stored one and a blank value clears it, so a
                client that does not know the field cannot wipe it by saving the rest of the tenant.
                The same applies to `contactEmail` and `contactPhone`.
              example: "Caritasverband für die Erzdiözese Musterstadt e.V."
            contactEmail:
              type: string
              format: email
              maxLength: 255
              description: >-
                Contact e-mail address of the Träger, shown in the mail footer's contact line. Optional.
              example: "beratung@caritas-musterstadt.de"
            contactPhone:
              type: string
              maxLength: 64
              description: Contact phone number of the Träger, shown in the mail footer. Optional.
              example: "+49 761 200-0"
            adminEmails:
              type: array
              items:
                type: string
              example: "[admin1@ob.de, admin2@ob.de]"
            createDate:
              type: string
            updateDate:
              type: string
            tenantIdReservationToken:
              type: string
              maxLength: 36
              description: Token of an open tenant ID reservation. When creating a tenant with
                a reserved ID, the matching token proves ownership of the reservation, which is
                then consumed atomically with the creation. Without a matching token a reserved
                ID is rejected with a conflict.
            licensing:
              $ref: '#/components/schemas/Licensing'
            theming:
              $ref:
                '#/components/schemas/Theming'
            content:
              $ref:
                '#/components/schemas/MultilingualContent'
            settings:
              $ref:
                '#/components/schemas/Settings'
            onboardingDpaAcceptance:
              $ref: '#/components/schemas/OnboardingDpaAcceptanceDTO'
    OnboardingDpaAcceptanceDTO:
      type: object
      description: 'Creation-only: the data processing agreement acceptance a tenant admin gave
        while onboarding through a public invite link (TEN-INV-U9/#569). Persisted append-only as
        the tenant''s admin signature in the SAME unit of work as the tenant creation, so a tenant
        never exists without the acceptance that created it. Ignored on update. Only the
        tenant-creating authority (platform admin / technical user) may submit it, which is why
        the signer identity is taken from the body instead of the access token: the signer is the
        freshly created tenant admin, not the calling service account.'
      required:
        - accepted
        - signerUserId
        - signerName
      properties:
        accepted:
          type: boolean
          description: Must be true - the tenant admin explicitly accepted the agreement
          example: true
        signerUserId:
          type: string
          maxLength: 255
          description: Keycloak user id of the tenant-admin account created for this onboarding
        signerUsername:
          type: string
          maxLength: 255
        signerName:
          type: string
          maxLength: 255
          example: "Toni Tenantadmin"
        signerPosition:
          type: string
          maxLength: 255
        signerEmail:
          type: string
          maxLength: 255
        signerOrganisation:
          type: string
          maxLength: 255
        language:
          type: string
          maxLength: 10
        dpaVersion:
          type: string
          description: Activation timestamp of the operator DPA version that was actually shown
            to the signer (ISO-8601 local date-time, as served by DpaVersionDTO.activationDate).
            Must be a genuinely published version; an unknown value is rejected with a conflict.
            Omitted means "the version currently in force".
          example: "2026-07-01T12:00:00"
    BasicTenantLicensingDTO:
      type: object
      required:
        - id
        - name
        - subdomain
      properties:
        id:
          type: integer
          format: int64
          example: 12132
        name:
          type: string
          example: "Company name AG"
          maxLength: 40
        subdomain:
          type: string
          example: "companyname"
          maxLength: 100
        createDate:
          type: string
        updateDate:
          type: string
        licensing:
          $ref: '#/components/schemas/Licensing'
    RestrictedTenantDTO:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 12132
        name:
          type: string
          example: "Company name AG"
          maxLength: 40
        subdomain:
          type: string
          example: "subdomain"
          maxLength: 100
        theming:
          $ref:
            '#/components/schemas/Theming'
        content:
          $ref:
            '#/components/schemas/Content'
        settings:
          $ref:
            '#/components/schemas/Settings'
        permissionPolicies:
          type: object
          readOnly: true
          description: Resolved boolean policies for downstream services. Suggestions are not applied to settings.
          additionalProperties:
            $ref: '#/components/schemas/BooleanPermissionPolicy'
    Licensing:
      type: object
      required:
        - allowedNumberOfUsers
      properties:
        allowedNumberOfUsers:
          type: integer
          example: 1
    Theming:
      type: object
      description: >-
        Tenant branding. The two accents form a pair: `primaryColor` is the DARK accent
        and `accent` is the LIGHT accent. Which one a surface uses depends on the surface's
        background, not on the user's theme preference alone — see the field descriptions.
      properties:
        logo:
          type: string
          example: "base64 encoded image"
        associationLogo:
          type: string
          example: "base64 encoded image"
        favicon:
          type: string
          example: "base64 encoded image"
        primaryColor:
          type: string
          example: "#8B1A2B"
          description: >-
            The DARK accent ("Dunkle Akzentfarbe"). Used on LIGHT-MODE surfaces, where a dark
            colour carries the contrast. Historic field name — semantics are unchanged and
            existing consumers depend on it, so it is not renamed.
        accent:
          type: string
          example: "#FFB3C7"
          description: >-
            The LIGHT accent ("Helle Akzentfarbe"). Used on DARK-MODE surfaces, where a light
            colour carries the contrast. May be null for tenants configured before this field
            existed; consumers then derive a light accent from `primaryColor` and must present
            that as a derived value, never as a configured one.
        secondaryColor:
          type: string
          example: "#FFFFFF"
        loginEffect:
          type: string
          enum: [NONE, LINES, CONNECTED_DOTS, CRACKS]
          example: "CRACKS"
          description: >-
            Which decorative effect the tenant's login stage runs. `NONE` (the default,
            and what an unset value means) keeps the plain stage with its cursor light
            cone. The other three are mutually exclusive looks; the frontend loads the
            code for exactly the one named here and never the others, so this field also
            decides what a visitor downloads. Desktop only — the stage is not rendered on
            small viewports, so no effect code is fetched there regardless of this value.
        signal:
          type: string
          example: "#D93025"
          description: >-
            Optional signal/attention colour of the tenant seed set (errors, warnings,
            destructive actions). Persisted so nothing the Admin panel submits is silently
            dropped; may be null when the tenant has never configured one.
    Content:
      type: object
      required:
        - impressum
      properties:
        impressum:
          type: string
          example: "Llorem ipsum..."
        impressumLanguages:
          type: object
          additionalProperties:
            type: string
          description: >-
            Raw stored language map for the impressum, including the `<lang>__meta`
            machine-translation metadata keys (JSON strings like
            `{"mt":true,"src":"de","at":"<ISO>"}`). Lets clients show a
            "machine translated / legally binding is German" notice. The `<lang>`
            values are the same sanitized HTML the resolved `impressum` field is
            picked from; the map is exposed as stored, no additional processing.
        claim:
          type: string
          example: "Llorem ipsum..."
          maxLength: 40
        erstantwortGreeting:
          type: object
          additionalProperties:
            type: string
          description: >-
            ORISO-Admin#601 / ADR-018. Träger-authored Erstantwort Baustein, stored as the
            same `<lang>` → HTML map the legal texts use, including the `<lang>__meta`
            machine-translation metadata keys. Absent means this Träger authored nothing and
            the resolution chain falls through to the platform text — which is not the same
            as an empty string, and must not be normalised into one.
        erstantwortWhoReadsAlong:
          type: object
          additionalProperties:
            type: string
          description: >-
            Who reads along. Träger-authored and mandatory by decision, because the Träger is
            the controller and ORISO the processor — the platform must not derive a claim about
            who has access to a counselling room.
        erstantwortEmergencyAddition:
          type: object
          additionalProperties:
            type: string
          description: >-
            Träger addition to the platform emergency numbers. An addition, never a replacement:
            the platform numbers carry no toggle at all (ADR-018 §6).
        erstantwortFreeNotice:
          type: object
          additionalProperties:
            type: string
          description: >-
            The single "Freier Hinweis" (ADR-018 §2) — the one Baustein the catalogue does not
            anticipate. Exactly one exists, enforced by the schema rather than by a rule.
        erstantwortClosing:
          type: object
          additionalProperties:
            type: string
          description: >-
            Träger-authored closing.
        erstantwortResponseDeadlineDays:
          type: integer
          example: 2
          minimum: 1
          maximum: 30
          description: >-
            The Antwortfrist in working days, as a NUMBER and never as prose (ADR-018), so the
            promise is one value comparable against what actually happened. Absent means the
            Träger never chose one and the platform default (2) applies — deliberately
            distinguishable from a Träger that chose 2.
        privacy:
          type: string
          example: "Llorem ipsum..."
        privacyLanguages:
          type: object
          additionalProperties:
            type: string
          description: >-
            Raw stored language map for the privacy statement, including the
            `<lang>__meta` machine-translation metadata keys. Same semantics as
            `impressumLanguages`. Note: contains the stored (unrendered) privacy
            text, i.e. without the data-protection placeholder rendering applied
            to `renderedPrivacy`.
        renderedPrivacy:
          type: string
          example: "Llorem ipsum..."
        termsAndConditions:
          type: string
          example: "Llorem ipsum..."
        termsAndConditionsConfirmation:
          type: string
          format: date-time
          example: 2022-12-07T11:51:01
          description: "Datetime stamp when new terms and condition defined"
        dataPrivacyConfirmation:
          type: string
          format: date-time
          example: 2022-12-07T11:51:01
          description: "Datetime stamp when new privacy defined"
        dataProtectionContactTemplate:
          $ref: '#/components/schemas/DataProtectionContactTemplateDTO'

    Settings:
      type: object
      properties:
        featureStatisticsEnabled:
          type: boolean
          example: "false"
        featureTopicsEnabled:
          type: boolean
          example: "false"
        topicsInRegistrationEnabled:
          type: boolean
          example: "false"
        featureDemographicsEnabled:
          type: boolean
          example: "false"
        featureAppointmentsEnabled:
          type: boolean
          example: "false"
        featureGroupChatV2Enabled:
          type: boolean
          example: "false"
        featureInternalGroupChatEnabled:
          type: boolean
          description: >-
            Internal group chats (counsellors only), switched separately from conversation
            circles (#250). When the tenant never stored a value, this reads the tenant's
            featureGroupChatV2Enabled.
          example: "true"
        featureSelfHelpGroupsEnabled:
          type: boolean
          description: >-
            Conversation circles / self-help groups (advice seekers take part), switched
            separately from internal group chats (#250). When the tenant never stored a value,
            this reads the tenant's featureGroupChatV2Enabled.
          example: "true"
        featureTeamDiscussionEnabled:
          type: boolean
          example: "false"
        featureToolsEnabled:
          type: boolean
          example: "false"
        featureAnonymousChatEnabled:
          type: boolean
          example: "true"
        featureDisplayNameEditable:
          type: boolean
          example: "true"
          description: "ORISO-Admin#602 switch 1. Whether an advice seeker may type their own Anzeigename (displayName), or may only re-roll the generated one. Never governs the Anmeldename (userName), which is immutable at every layer. Opt-out: defaults to true."
        featureAskerEmailEnabled:
          type: boolean
          example: "true"
          description: "ORISO-Admin#602 switch 2. Whether an advice seeker may leave an e-mail address at all. When false it must silence both the in-chat Erstantwort Baustein and the profile e-mail field. Opt-out: defaults to true."
        featureCallsEnabled:
          type: boolean
          example: "true"
        featureSupervisionEnabled:
          type: boolean
          example: "true"
          description: "Master toggle for supervision functionality (adding/removing supervisors, supervision views)."
        featureSupervisionAnonymousChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable supervision functionality in anonymous chats."
        featureSupervisionOneOnOneChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable supervision functionality in 1-on-1 chats."
        featureAudioCallsEnabled:
          type: boolean
          example: "true"
          description: "Master toggle for audio call button availability (all chat types)."
        featureAudioCallsAnonymousChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable audio call button in anonymous chats."
        featureAudioCallsOneOnOneChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable audio call button in 1-on-1 chats."
        featureAudioCallsGroupChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable audio call button in group chats."
        featureAudioCallsSupervisionChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable audio call button when a user is in supervision mode."
        featureVideoCallsEnabled:
          type: boolean
          example: "true"
          description: "Master toggle for video call button availability (all chat types)."
        featureVideoCallsAnonymousChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable video call button in anonymous chats."
        featureVideoCallsOneOnOneChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable video call button in 1-on-1 chats."
        featureVideoCallsGroupChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable video call button in group chats."
        featureVideoCallsSupervisionChatsEnabled:
          type: boolean
          example: "true"
          description: "Enable video call button when a user is in supervision mode."
        featureThreadsEnabled:
          type: boolean
          example: "true"
          description: "Master toggle for threads availability (all chat types)."
        featureThreadsAnonymousChatsEnabled:
          type: boolean
          example: "true"
